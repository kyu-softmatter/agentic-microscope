# Effective pixel size at the sample, per objective x intermediate magnification.
#
# Machine-readable mirror of `kb/systems/current.md > pixel_size_calibration`,
# the same way data/objectives.yaml mirrors that file's `objectives` entry. The
# dossier stays the record; this file is what code reads.
#
# Source: "Confocal_microscope_conversion_factor(Apr 2025).xlsx", Sheet1,
# dated 2025-04, provided by the user. Camera: Kinetix.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE TREATING THE TABLE AS MEASURED  (added 2026-09-04)
# ---------------------------------------------------------------------------
# Eleven of the twelve cells are exactly the nominal quotient
#
#     p_sample = p_sensor / (M_obj * M_int),   p_sensor = 6.5 um (Kinetix)
#
# to every digit the spreadsheet carries. 6.5/4 = 1.625, 6.5/15 = 0.43333,
# 6.5/150 = 0.04333, and so on. A stage-micrometer measurement agreeing with
# arithmetic to five significant figures in eleven independent cells is not
# what a measurement looks like -- so those eleven are recorded here as
# `nominal`, and they return exactly what detection.photometry.effective_pixel_nm
# already computes from data/detectors.yaml. Using them changes no verdict.
#
# ---------------------------------------------------------------------------
# AND THE TWELFTH IS NOT THE EXCEPTION EITHER  (revised 2026-09-09)
# ---------------------------------------------------------------------------
# The 20x row was marked `measured` from 2026-09-04, on the reasoning that
# 6.5/20 = 0.325 against a table 0.32373, and 6.5/30 = 0.216667 against 0.21582
# -- both low by 0.39 %, consistently -- which is what a real 20.078x objective
# would look like.
#
# **KH judges 0.39 % to be agreement, not a departure (2026-09-09).** On that
# reading the row is the arithmetic too, the internal consistency is just the
# same formula twice, and 20.078x is a story fitted to rounding.
#
# So NONE OF THE SPREADSHEET'S TWELVE CELLS IS A MEASUREMENT. The whole table
# reproduces p_sensor / (M_obj * M_int), and its title -- a "conversion factor"
# table -- promises something it does not contain.
#
# ---------------------------------------------------------------------------
# 100x IS MEASURED, AND NOT FROM THE SPREADSHEET  (2026-09-09)
# ---------------------------------------------------------------------------
# A separate measurement exists and had never been filed here. On 2026-09-03
# two independent length standards were driven over 10 um at 100x and the
# displacement read off the camera:
#
#     piezo stage (closed-loop, chamber-stuck particle)  ->  0.06460 um/px
#     AOD trap    (trapped bead, y)                      ->  0.06445 um/px
#     mean                                                   0.06453 um/px
#
# The two agree with each other to 0.24 %, and with the nominal 0.065 to 0.73 %
# -- which KH judges to be agreement (2026-09-09), so this CONFIRMS the formula
# at the standing objective rather than contradicting it.
#
# It is `measured` because a length standard is a length standard: the earlier
# note in this file demanded a stage micrometer specifically, and that was
# wrong (KH, 2026-09-09). A calibrated closed-loop piezo driven a known
# distance measures scale. What is recorded is the value that came out of it.
#
# The distinction is not pedantry here: lens 6 owns pixel calibration (G24) and
# the whole provenance axis is `measured` vs `assumed`. G24 takes
# `pixel_size_measured` as a claim the caller makes, so nothing in code breaks
# when this goes to `nominal` -- but any caller that set it True on the strength
# of the 20x row was wrong, and now provably.
#
# What would promote any other row: drive a known length at THAT objective and
# read the displacement off the camera -- a stage micrometer, the piezo, or the
# trap. Nothing promotes a cell except a length actually traversed at it.
#
# 0.7 % IS AGREEMENT TOO (KH, 2026-09-09), which settles the 100x row the other
# way round from how it was first written. Two independent 10 um rulers at 100x
# agree with the nominal 0.065 inside that tolerance -- so the cross-check
# PASSED. There is no lurking 0.7 % error in kappa; the arithmetic was checked
# against hardware at the standing objective and held.

pixel_size:
  camera: Kinetix
  sensor_pixel_um: 6.5        # cross-check against data/detectors.yaml > Kinetix > pixel_um
  unit: um_per_px
  binning: 1                  # every cell below is at binning 1; scale linearly
  source_file: "Confocal_microscope_conversion_factor(Apr 2025).xlsx"
  source_sheet: Sheet1
  source_date: 2025-04
  mirrors: "kb/systems/current.md > pixel_size_calibration"

  # 2026-09-04: the .cfg's PixelSize block, empty until now, carries the 1x
  # column of this table (config/micromanager/single_cam_red_noDMD.cfg), so
  # getPixelSizeUm() answers instead of returning 0.0. tests/test_pixel_size.py
  # reads those presets back and compares them here, because the same number in
  # two files is how a calibration goes stale without anyone noticing.
  #
  # Those presets key on the Nosepiece ALONE and are therefore only right at
  # intermediate 1x -- IntermediateMagnification's turret positions are named
  # nowhere in the .cfg, so a two-property preset cannot be written yet. At 1.5x
  # MM reports the 1x number, high by exactly 1.5x. Closing it is one command at
  # the instrument: `python -m calibration.cli intermediate-mag <cfg>`.
  cfg_presets:
    file: config/micromanager/single_cam_red_noDMD.cfg
    covers: intermediate 1x only
    keyed_on: [Nosepiece]
    pending: "IntermediateMagnification labels -- see calibration.cli intermediate-mag"
    # Do not hand-edit the block. `config/micromanager/set_pixel_size.py` adds a
    # preset for a recommended objective from this table, dry-run by default,
    # and `--audit` reports every nosepiece position the .cfg cannot name a
    # pixel size for. It refuses to substitute p_sensor/M for a missing row, to
    # key on a label the nosepiece does not have, or to overwrite a preset that
    # disagrees. File only -- it never opens a device.
    maintained_by: config/micromanager/set_pixel_size.py

  # Keyed by nominal objective magnification, then by intermediate magnification.
  # `evidence` is per row, because it differs per row.
  table:
    "4":
      evidence: nominal
      values: {"1x": 1.625, "1.5x": 1.0833}
    "10":
      evidence: nominal
      values: {"1x": 0.65, "1.5x": 0.43333}
    "20":
      evidence: nominal
      values: {"1x": 0.32373, "1.5x": 0.21582}
      note: >
        Was `measured` from 2026-09-04 to 2026-09-09. It is the only row whose
        digits differ from the quotient -- 0.32373 against 6.5/20 = 0.325, and
        0.21582 against 0.216667, both low by 0.39 % -- and that was read as a
        real 20.078x objective. KH judges 0.39 % to be agreement (2026-09-09),
        so it is arithmetic like the other eleven and the consistency between
        the two intermediate magnifications is just the same formula twice.
        The VALUES are unchanged; only the tier moved.
    "40":
      evidence: nominal
      values: {"1x": 0.1625, "1.5x": 0.10833}
    "60":
      evidence: nominal
      values: {"1x": 0.10833, "1.5x": 0.07222}
    "100":
      evidence: measured
      values: {"1x": 0.06453, "1.5x": 0.04333}
      measured_1x_um_per_px: 0.06453
      measured_date: 2026-09-03
      measured_by: >-
        Two independent length standards over 10 um, read off the camera:
        the closed-loop piezo stage on a chamber-stuck particle gave
        0.06460 um/px, and the AOD trap on a held bead in y gave 0.06445.
        They agree to 0.24 %. Source:
        kb/decisions/2026-09-03-three-subsystems-first-light.md §9.
      note: >
        ⚠ THE 1.5x CELL IS STILL NOMINAL. Only 1x was driven. 0.04333 is
        6.5/150; dividing the measured 1x by 1.5 would give 0.04302, and that
        would be a derived number wearing a measured tier. Left alone.

        ⚠ THIS VALUE NOW DISAGREES WITH THE .cfg. All six Micro-Manager configs
        carry `PixelSize_um,100x-1x,0.065`, so `getPixelSizeUm()` answers the
        nominal while this file answers the measurement -- 0.73 % apart, which
        is inside the agreement KH stated but is still two sources with
        different digits. `config/micromanager/set_pixel_size.py` is the tool
        that would reconcile them; whether to is not decided here.

        kappa scales as 1/pixel size, so every trap stiffness computed from
        0.065 is 0.73 % low against this. Inside the stated tolerance, so no
        correction is called for -- recorded because the direction is now known
        rather than unknown.

