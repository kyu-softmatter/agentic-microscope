# Effective pixel size at the sample, per objective x intermediate magnification.
#
# Machine-readable mirror of `kb/systems/current.md > pixel_size_calibration`,
# the same way data/objectives.yaml mirrors that file's `objectives` entry. The
# dossier stays the record; this file is what code reads.
#
# Source: "Confocal_microscope_conversion_factor(Apr 2025).xlsx", Sheet1,
# dated 2025-04, provided by the user. Camera: Kinetix.
#
# ---------------------------------------------------------------------------
# THE TABLE IS MEASURED  (settled 2026-09-09, after two reversals)
# ---------------------------------------------------------------------------
# The spreadsheet is a measurement and its values are used as they stand
# (KH, 2026-09-09: "이미 측정을 한거야. 그 픽셀 변환값을 그대로 사용해").
#
# THIS OVERTURNS THIS FILE'S OWN 2026-09-04 ANALYSIS, which is kept below
# because the observation in it is still true and only the conclusion was
# wrong. Eleven of the twelve cells equal the nominal quotient
#
#     p_sample = p_sensor / (M_obj * M_int),   p_sensor = 6.5 um (Kinetix)
#
# to every digit the spreadsheet carries -- 6.5/4 = 1.625, 6.5/15 = 0.43333,
# 6.5/150 = 0.04333. From that it was argued that "eleven independent readings
# agreeing with division to five significant figures is not what a measurement
# looks like", and all eleven were demoted to `nominal`.
#
# That argument reasons from the DIGITS to how the spreadsheet was produced. It
# is an inference about provenance, made by a reader who does not have the
# instrument. The operator does, and says it was measured. The same precedent
# is already recorded in kb/systems/current.md:1284 for the trapping field --
# "an operator statement about their own instrument outranks" a shape inferred
# from a drawing.
#
# ⚠ WHAT THE DIGITS STILL SAY, because it does not stop being odd: eleven cells
# landing on the quotient to five figures means either the objectives are very
# close to their nominal magnifications and the measurement rounded onto the
# arithmetic, or the spreadsheet recorded the arithmetic. Only the first is
# consistent with the operator's statement, and it is not implausible -- the one
# cell that departs, 20x by 0.39 %, is the size of departure you would expect
# from a real 20.078x objective. Reading it that way makes the table internally
# coherent: five objectives near nominal, one measurably off.
#
# CONSEQUENCE. L6.3 (lens 6, pixel calibration) takes `pixel_size_measured` as a
# claim the caller makes. Callers may now make it at ANY objective, where before
# 2026-09-09 the honest answer was nowhere and then 100x only. Every
# pixel-size-dependent quantity can now `advance` at every magnification.
#
# The 100x 1x cell does NOT come from the spreadsheet -- see its own note. It
# has a second, independent measurement from 2026-09-03 that agrees to 0.73 %,
# and the more direct of the two is what is recorded.

pixel_size:
  camera: Kinetix
  sensor_pixel_um: 6.5        # cross-check against data/detectors.yaml > Kinetix > pixel_um
  unit: um_per_px
  binning: 1                  # every cell below is at binning 1; scale linearly
  source_file: "Confocal_microscope_conversion_factor(Apr 2025).xlsx"
  source_sheet: Sheet1
  source_date: 2025-04
  mirrors: "kb/systems/current.md > pixel_size_calibration"

  # 2026-09-04: the .cfg's PixelSize block, empty until now, carries the 1x
  # column of this table (config/micromanager/single_cam_red_noDMD.cfg), so
  # getPixelSizeUm() answers instead of returning 0.0. tests/test_pixel_size.py
  # reads those presets back and compares them here, because the same number in
  # two files is how a calibration goes stale without anyone noticing.
  #
  # Those presets key on the Nosepiece ALONE and are therefore only right at
  # intermediate 1x -- IntermediateMagnification's turret positions are named
  # nowhere in the .cfg, so a two-property preset cannot be written yet. At 1.5x
  # MM reports the 1x number, high by exactly 1.5x. Closing it is one command at
  # the instrument: `python -m calibration.cli intermediate-mag <cfg>`.
  cfg_presets:
    file: config/micromanager/single_cam_red_noDMD.cfg
    covers: intermediate 1x only
    keyed_on: [Nosepiece]
    pending: "IntermediateMagnification labels -- see calibration.cli intermediate-mag"
    # Do not hand-edit the block. `config/micromanager/set_pixel_size.py` adds a
    # preset for a recommended objective from this table, dry-run by default,
    # and `--audit` reports every nosepiece position the .cfg cannot name a
    # pixel size for. It refuses to substitute p_sensor/M for a missing row, to
    # key on a label the nosepiece does not have, or to overwrite a preset that
    # disagrees. File only -- it never opens a device.
    maintained_by: config/micromanager/set_pixel_size.py

  # Keyed by nominal objective magnification, then by intermediate magnification.
  # `evidence` is per row, because it differs per row.
  table:
    "4":
      evidence: measured
      values: {"1x": 1.625, "1.5x": 1.0833}
    "10":
      evidence: measured
      values: {"1x": 0.65, "1.5x": 0.43333}
    "20":
      evidence: measured
      values: {"1x": 0.32373, "1.5x": 0.21582}
      effective_magnification: 20.078   # 6.5 / 0.32373, and 6.5 / (0.21582*1.5)
      # WHY THE DEPARTURE IS THE OBJECTIVE AND NOT SOMETHING UPSTREAM.
      # 0.39 % could in principle live in the tube lens, the sensor pitch or
      # the intermediate magnifier. The table rules all three out by itself:
      #   · the tube lens and the 6.5 um sensor are SHARED BY ALL SIX rows, so
      #     an error in either would put all six off by 0.39 %. Four of the
      #     other five give M to 4.000 / 10.000 / 40.000 / 60.002.
      #   · the intermediate magnifier is ruled out by 20x's own two cells:
      #     6.5/0.32373 and 6.5/(0.21582*1.5) both give 20.0785, so the same
      #     departure survives both paths and is upstream of the magnifier.
      # What is left is the objective. 20.078x it is.
      note: >
        The only row whose digits depart from the quotient: 0.32373 against
        6.5/20 = 0.325, and 0.21582 against 0.216667, both low by 0.39 % --
        which is what a real 20.078x objective looks like, consistently at both
        intermediate settings.

        Its tier changed twice on 2026-09-09 and landed back where it started.
        It was demoted when KH judged 0.39 % to be agreement rather than a
        departure, then restored with the rest of the table when he ruled the
        spreadsheet a measurement. Both rulings hold at once: the departure is
        small enough to call agreement, AND the cell is measured. The 20.078x
        reading is the one that makes the table coherent -- five objectives
        landing on nominal, one measurably off.
    "40":
      evidence: measured
      values: {"1x": 0.1625, "1.5x": 0.10833}
    "60":
      evidence: measured
      values: {"1x": 0.10833, "1.5x": 0.07222}
    "100":
      evidence: measured
      values: {"1x": 0.06453, "1.5x": 0.04333}
      measured_1x_um_per_px: 0.06453
      measured_date: 2026-09-03
      measured_by: >-
        Two independent length standards over 10 um, read off the camera:
        the closed-loop piezo stage on a chamber-stuck particle gave
        0.06460 um/px, and the AOD trap on a held bead in y gave 0.06445.
        They agree to 0.24 %. Source:
        kb/decisions/2026-09-03-three-subsystems-first-light.md §9.
      note: >
        ⚠ THE TWO CELLS OF THIS ROW DISAGREE, and both are kept. They are
        different measurements, not one measurement and its arithmetic: 1x is
        the 2026-09-03 rulers, 1.5x is the 2025-04 spreadsheet. Back out the
        magnification and they say

            6.5 / 0.06453          = 100.73x     (the rulers)
            6.5 / (0.04333 * 1.5)  = 100.01x     (the spreadsheet)

        -- 0.72 % apart, which is inside the agreement KH stated, and the same
        0.72 % as the 1x cell's own gap from 6.5/100. Every other row's two
        cells agree to four figures, so this row is the one place the table is
        not internally consistent, and it is because it carries two independent
        measurements rather than one.

        Neither is overwritten with the other. Dividing the measured 1x by 1.5
        would give 0.04302 and read as a measurement of the 1.5x path, which
        nobody made.

        ⚠ THIS VALUE NOW DISAGREES WITH THE .cfg. All six Micro-Manager configs
        carry `PixelSize_um,100x-1x,0.065`, so `getPixelSizeUm()` answers the
        nominal while this file answers the measurement -- 0.73 % apart, which
        is inside the agreement KH stated but is still two sources with
        different digits. `config/micromanager/set_pixel_size.py` is the tool
        that would reconcile them; whether to is not decided here.

        kappa scales as 1/pixel size, so every trap stiffness computed from
        0.065 is 0.73 % low against this. Inside the stated tolerance, so no
        correction is called for -- recorded because the direction is now known
        rather than unknown.

