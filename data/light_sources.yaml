# Light-source registry.
#
# ── Schema ────────────────────────────────────────────────────────────────
# light_sources:
#   <device-label-as-in-micromanager>:
#     model / vendor
#     lines:
#       <line-name-as-in-metadata>:
#         center_nm / fwhm_nm      or  curve: <file>
#         max_power_mw:            light-source output (not at sample plane)
#         power_at_sample_mw:      { <objective label>: mW at 100% level }
#         linear_in_level:         is the % setting linear in output
#
# ── Why power_at_sample_mw is decisive ───────────────────────────────────
# Metadata retains **only the percent**, e.g. `Spectra-Red_Level: 10`.
# Percent means nothing on a different instrument. Moving a setting to another
# microscope requires a physical quantity (sample-plane mW, or W/cm²).
#
# If this value is empty:
#   · no absolute photon budget → exposure cannot be computed from scratch
#   · only relative (precedent-based) advice, valid only on the same instrument
#
# How to measure (do it once; takes 30 minutes):
#   1. Put the power-meter sensor where the objective sits (measure at the real
#      sample position, not at the back focal plane with the objective removed)
#   2. Record mW for each line × each objective × level 10/25/50/75/100%
#   3. Divide by illuminated area (FOV) to get W/cm² → write that value here
#   4. Record in note the lower level bound where linearity breaks

light_sources:

  # ══════════════════════════════════════════════════════════════════════
  # Light source actually used in generations A·B (MM device label: `Spectra`)
  # Observed lines (record counts): Red(429+134+61), Cyan(115+76+76+20+12), Green(14+6+3)
  # ══════════════════════════════════════════════════════════════════════
  Spectra:
    model: "Lumencor Spectra X"
    vendor: Lumencor
    note: >
      ⚠ Nominal catalog center wavelengths and FWHM. May differ with the filter
      set actually installed, and for Green/Yellow the 555/585 switch depends on
      whether the YG filter is inserted (check `Spectra-YG_Filter` in the
      metadata).
      Not a single measured output value exists, so absolute photon-budget
      calculation is currently impossible.
    lines:
      Violet:
        center_nm: 395
        fwhm_nm: 25
        power_at_sample_mw: {}
      Blue:
        center_nm: 440
        fwhm_nm: 20
        power_at_sample_mw: {}
      Cyan:
        center_nm: 470
        fwhm_nm: 24
        power_at_sample_mw: {"4x": 15.5, "10x": 14.5, "20x": 13.3}
        linear_in_level: false
        note: >
          Used for the 488-GFP channel — the bench label for this line is "488"
          (KH 2026-09-09). Observed levels 2·5·10·50·100%.
          Power MEASURED 2026-09-09, mirror IN. With the mirror out it is
          35.8/33.4/30.3 — a factor 2.3, and the schema has no slot for the
          path, so read these as mirror-in only.
          Not linear below ~30%: 0.60 of linear at 5%, 0.75 at 10%, 0.95 at 30%.
          → kb/calibrations/illumination-power.yaml
      Teal:
        center_nm: 508
        fwhm_nm: 25
        power_at_sample_mw: {}
      Green:
        center_nm: 555
        fwhm_nm: 28
        power_at_sample_mw: {"4x": 17.5, "10x": 16.7, "20x": 15.3}
        linear_in_level: false
        note: >
          555-TRITC channel. May shift to 585 depending on YG filter state.
          Power MEASURED 2026-09-09, mirror IN. Mirror out: 39.9/38.1/34.9.
          Not linear below ~30%: 0.65 of linear at 5%, 0.85 at 10%, 0.96 at 30%.
          → kb/calibrations/illumination-power.yaml
      Yellow:
        center_nm: 585
        fwhm_nm: 29
        power_at_sample_mw: {}
      Red:
        center_nm: 640
        fwhm_nm: 30
        power_at_sample_mw: {"4x": 12.3, "10x": 11.3, "20x": 9.9}
        linear_in_level: false
        note: >
          647-Cy5 channel — the bench label is "647". Observed levels
          5·7·8·10·13·100%. Exposures on that channel cluster at 500 ms, which
          suggested the light level was insufficient; measurement 2026-09-09
          supports it — at 9.9 mW this is the dimmest Spectra line measured,
          against 15.3 at 555.
          MEASURED 2026-09-09, mirror IN. Mirror out: 27.6/25.4/22.0.
          ⚠ A PEDESTAL at low level, not a shortfall: 1.62 of linear at 5% and
          1.21 at 10%. It is the source and not the meter — 0.8 mW at 5% mirror
          in against 2.0 mW mirror out is a ratio of 0.40, matching this
          instrument's measured mirror transmission of ~0.44.
          → kb/calibrations/illumination-power.yaml
      White:
        center_nm: 0
        fwhm_nm: 0
        note: "Broadband. No wavelength model — a curve is required to use it"

  # ══════════════════════════════════════════════════════════════════════
  # Present in generations B·C (MM device label: `LightEngine`)
  # 2026-08-10 product name SpectraIII confirmed in NIS-Elements Device Manager;
  # lines are approximate center wavelengths read from diagram icons (7 channels)
  # — fwhm unconfirmed.
  # ══════════════════════════════════════════════════════════════════════
  LightEngine:
    # ⚠⚠ 2026-09-03: THE DEVICE CONTRADICTS THIS ENTRY. Read live over MMCore
    # from the loaded adapter (config/micromanager/single_cam_red_noDMD.cfg):
    #
    #     LEModel        = "Spectra III 8-NII-XS"      <- the name dropped below
    #     SerialNumber   = 28145
    #     FirmwareVersion= 3.5.4
    #     Connection     = COM3                        <- not Ethernet
    #     lines (8, NAMED not numeric):
    #       VIOLET  BLUE  CYAN  TEAL  GREEN  YELLOW  RED  NIR
    #     each as <NAME> (0/1) + <NAME>_Intensity (0-1000 PER-MILLE, not %)
    #
    # So both the channel count (7 vs 8) and the "8-NII-XS dropped" note are
    # wrong, and GREEN — the 555 line this entry implies does not exist — is
    # right there on the device. The common factor with the Aura entry below is
    # that both were read from NIS-Elements diagram icons rather than from the
    # hardware.
    #
    # The numeric keys under `lines:` are LEFT IN PLACE deliberately, because
    # config/scopes/current-spectra.yaml enumerates them and renaming them is a
    # multi-file change with gate consequences. Treat the keys as unverified
    # labels, not as measured centre wavelengths.
    # Full detail: kb/decisions/2026-09-03-three-subsystems-first-light.md §3
    model: "Lumencor Spectra III"     # device says "Spectra III 8-NII-XS" (2026-09-03)
    vendor: Lumencor
    connection: "COM3"                # 2026-09-03 read off the device; was recorded as Ethernet
    device_reported:                  # 2026-09-03, live over MMCore
      le_model: "Spectra III 8-NII-XS"
      serial: "28145"
      firmware: "3.5.4"
      connection: "COM3"
      line_names: [VIOLET, BLUE, CYAN, TEAL, GREEN, YELLOW, RED, NIR]
      intensity_unit: "per-mille (0-1000)"
    note: >
      ⚠ 42 records have `Core-Shutter = LightEngine` yet no non-zero intensity
      was observed anywhere in the scanned range. Means either the property name
      differs or the actual illumination path was different. Check the .cfg.
      2026-08-10: only the center wavelengths of the 7 LED lines were read from
      the NIS-Elements diagram (365/440/488/514/561/594/640). fwhm and measured
      power are still missing — the fwhm_nm values below are catalog-approximation
      placeholders, not measured.
      ⚠ 2026-09-03: the device reports EIGHT named lines including GREEN — see
      the comment block above. The line keys below are unverified.
    lines:
      "365": { center_nm: 365, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "440": { center_nm: 440, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "488": { center_nm: 488, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "514": { center_nm: 514, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "561": { center_nm: 561, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "594": { center_nm: 594, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "640": { center_nm: 640, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }

  # ══════════════════════════════════════════════════════════════════════
  # 2026-08-10 confirmed in NIS-Elements Device Manager (MM device label: `Aura`)
  # Product name AuraIII, 5 channels. Center wavelengths read from diagram icons
  # — fwhm unconfirmed.
  # ══════════════════════════════════════════════════════════════════════
  Aura:
    # ⚠⚠ 2026-09-03: THE DEVICE CONTRADICTS THE LINE LIST BELOW.
    #
    #     LEModel        = "Aura III 5-NII-WA"
    #     SerialNumber   = 30859
    #     FirmwareVersion= 3.14.7
    #     lines (5, NAMED not numeric):  UV  CYAN  GREEN  RED  NIR
    #     each as <NAME> (0/1) + <NAME>_Intensity (0-1000 PER-MILLE, not %)
    #
    # The keys below (405/440/488/561/640) came from NIS-Elements diagram icons
    # and do not match. GREEN is the line actually used for 555 ex / red em on
    # 2026-09-03; a bead peak of ~30,100 counts over a 208 background was
    # reached at GREEN_Intensity = 50/1000 (5%) with a 33.33 ms exposure at
    # 100x, and showed NO measurable bleaching over 5 s (+2.19% first-15 vs
    # last-15 frames).
    #
    # Also: this chassis had to be POWERED ON. Before that, initialisation
    # failed with "Error : 573" while COM7 opened cleanly from a bare
    # SerialPort — so 573 from the Lumencor adapter means "no reply", not
    # "no port".
    #
    # Keys left in place: config/scopes/current-aura.yaml enumerates them.
    # Full detail: kb/decisions/2026-09-03-three-subsystems-first-light.md §3
    model: "Lumencor Aura III"        # device says "Aura III 5-NII-WA" (2026-09-03)
    vendor: Lumencor
    connection: COM7
    device_reported:                  # 2026-09-03, live over MMCore
      le_model: "Aura III 5-NII-WA"
      serial: "30859"
      firmware: "3.14.7"
      line_names: [UV, CYAN, GREEN, RED, NIR]
      intensity_unit: "per-mille (0-1000)"
    driving_it:   # ⚠ read this before writing a line on this engine
      properties_per_line: ["<NAME>", "<NAME>_Intensity"]
      master: "State"
      warning: >
        ⚠ THREE PROPERTIES, NOT TWO. Setting `GREEN = 1` and
        `GREEN_Intensity = 50` is NOT enough -- the engine also has a master
        `State` (0/1) which is its shutter, and with `State = 0` NOTHING COMES
        OUT however the line is set. There is no error and no readback that
        looks wrong; the camera simply returns a frame indistinguishable from a
        dark frame.

        Measured cost, 2026-09-06: the first run of
        config/session/measure_red_bead_em1.py set only the two line properties,
        got a field whose median was 10-24 ADU BELOW the dark frame, and printed
        a filter ratio computed almost entirely on the camera's own hot pixels
        (96.9% of its "bright" pixels were also bright in the dark frame). It
        looked like a result. The guard that now catches it: after enabling
        light, snap through the widest filter in the wheel and require the
        median to RISE above the dark frame, else refuse.

        `Core.Shutter` is `LightEngine` (the SpectraIII on COM3), NOT `Aura`, so
        autoshutter never opens this engine either -- and autoshutter is off by
        design during a measurement (SAFETY.md §6). Nothing else will open it
        for you.
    note: >
      2026-08-10 product name confirmed in NIS-Elements Device Manager. No fwhm,
      no measured power.
      2026-09-06: GREEN at 50/1000 with a 33.33 ms exposure at 4x is confirmed
      to excite abvigen-red-5um-cooh well (SNR 18.6 through a 21 nm bandpass,
      no measurable bleaching over the run). The line reaches the sample through
      the MXR00724-EX 544-565 band on the widefield path.
      ⚠ 2026-09-03: the device reports five NAMED lines (UV/CYAN/GREEN/RED/NIR),
      not the numeric keys below — see the comment block above. Keys unverified.
    lines:
      # Power MEASURED 2026-09-09 at the sample plane, mirror IN, per objective
      # at level 100%. The bench labels were 488 / 555 / 647; KH confirmed those
      # are these keys' 488 / 561 / 640 (2026-09-09).
      # ⚠ The KEYS THEMSELVES are still unverified — see the warning above. A
      # measured power filed against an unverified key is a measured number in a
      # slot that may belong to another line.
      "405": { center_nm: 405, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "440": { center_nm: 440, fwhm_nm: 20, power_at_sample_mw: {}, note: "fwhm unconfirmed placeholder" }
      "488": { center_nm: 488, fwhm_nm: 20, power_at_sample_mw: {"4x": 47, "10x": 45, "20x": 46},
               linear_in_level: false,
               note: "fwhm unconfirmed placeholder. Measured 2026-09-09, mirror in. OVER-delivers below ~10%: 1.30 of linear at 5%, 1.09 at 10%. → kb/calibrations/illumination-power.yaml" }
      "561": { center_nm: 561, fwhm_nm: 20, power_at_sample_mw: {"4x": 48.3, "10x": 47.5, "20x": 46.5},
               linear_in_level: true,
               note: "fwhm unconfirmed placeholder. Measured 2026-09-09, mirror in; bench label 555. Linear 5-100% (0.97-1.01). → kb/calibrations/illumination-power.yaml" }
      "640": { center_nm: 640, fwhm_nm: 20, power_at_sample_mw: {"4x": 16.5, "10x": 16.1, "20x": 15.9},
               linear_in_level: true,
               note: "fwhm unconfirmed placeholder. Measured 2026-09-09, mirror in; bench label 647. Linear 5-100% (0.94-1.01), and ~3x dimmer than 488/561. → kb/calibrations/illumination-power.yaml" }

    # ── Named lines: what the device actually exposes ────────────────────
    # The device reports UV / CYAN / GREEN / RED / NIR. None can be registered
    # as a usable line yet, because a line needs a centre and a width and this
    # chassis has published neither -- so they sit here as OBSERVATIONS ONLY,
    # deliberately not under `lines:`. A channel config cannot reference them
    # and the optics gate cannot compute with them until a datasheet for the
    # "Aura III 5-NII-WA" configuration, or a measured spectrum, supplies
    # centre + FWHM per named line. Do NOT map a named line onto one of the
    # numeric keys above by guessing -- CYAN -> "488" is the tempting one, and
    # it is still a guess.
    named_lines_observed:
      CYAN:
        center_nm: null
        fwhm_nm: null
        works_for: >
          2026-09-05, operator at the microscope: properly excites Dragon Green
          in Bangs FCDG008 (dye abs peak 480 nm), seen through the CSUW1 filter
          wheel position 2 (label "488"). So CYAN carries real power near
          480 nm. That bounds the band; it does not measure it.
      GREEN:
        center_nm: null
        fwhm_nm: null
        works_for: >
          2026-09-03: used for 555 ex / red em. Bead peak ~30,100 counts over a
          208 background at GREEN_Intensity 50/1000 (5%), 33.33 ms, 100x, with
          no measurable bleaching over 5 s (+2.19% first-15 vs last-15 frames).
      UV:  { center_nm: null, fwhm_nm: null, works_for: null }
      RED: { center_nm: null, fwhm_nm: null, works_for: null }
      NIR: { center_nm: null, fwhm_nm: null, works_for: null }

  # ══════════════════════════════════════════════════════════════════════
  # Laser — 2026-08-10 confirmed in NIS-Elements Device Manager. Not registered
  # in the MM .cfg (NIS-Elements-only control). CSU-W1 confocal excitation source.
  # ══════════════════════════════════════════════════════════════════════
  LUN-F-XL:
    model: "Nikon LUN-F-XL laser combiner"
    vendor: Nikon
    connection: null
    note: >
      4-line laser unit, feeding the CSU-W1 spinning disk. Line wavelengths read
      from NIS-Elements diagram icons. They match the reflection bands of the
      Di01-T405/488/568/647 dichroic (data/filters.yaml) exactly, so confidence is
      high.
      fwhm approximated from typical laser-diode values (~1-2 nm), not measured.
      No measured power (power_at_sample_mw) — absolute photon budget cannot be
      computed.
    lines:
      # Power MEASURED 2026-09-09 at the sample plane, per objective at 100%.
      # ⚠ TAKEN WITH THE MULTIBAND FILTER OUT, which is the only configuration
      # this path was measured in. The schema has no slot for the path, so these
      # are not comparable with the Aura and Spectra rows above (mirror in).
      # ⚠ This is by far the dimmest of the three engines — 6.5-9.9 mW at 20x
      # against the Aura's 15.9-46.5 — and it is UNUSABLE BELOW ~30% level: 5%
      # and 10% did not read at all, and 30% delivers 0.31-0.63 of linear.
      "405": { center_nm: 405, fwhm_nm: 1, power_at_sample_mw: {} }
      "488": { center_nm: 488, fwhm_nm: 1, power_at_sample_mw: {"4x": 7.0, "10x": 7.0, "20x": 6.9},
               linear_in_level: false,
               note: "Measured 2026-09-09, multiband OUT. Unreadable at 5-10%; 0.63 of linear at 30%. → kb/calibrations/illumination-power.yaml" }
      "561": { center_nm: 561, fwhm_nm: 1, power_at_sample_mw: {"4x": 6.9, "10x": 6.7, "20x": 6.5},
               linear_in_level: false,
               note: "Measured 2026-09-09, multiband OUT; bench label 555. Unreadable at 5-10%; 0.31 of linear at 30%. → kb/calibrations/illumination-power.yaml" }
      "640": { center_nm: 640, fwhm_nm: 1, power_at_sample_mw: {"4x": 10.6, "10x": 10.3, "20x": 9.9},
               linear_in_level: false,
               note: "Measured 2026-09-09, multiband OUT; bench label 647. Unreadable to 30%; 0.61 of linear at 50%. Operator noted 'aperture full, size is different' on this row, which bears on whether the spot fitted the head. → kb/calibrations/illumination-power.yaml" }

  # ══════════════════════════════════════════════════════════════════════
  # Transmitted light
  # ══════════════════════════════════════════════════════════════════════
  DiaLamp:
    model: "Nikon transmitted-light lamp"
    note: >
      `DiaLamp-Intensity` observed value example: 1901 (unit unknown, assumed to be
      DAC counts).
      Shutter device for 1,186 brightfield acquisitions. Color temperature affects
      exposure and color reproduction, so the same intensity must be kept for
      quantitative comparison.
    lines:
      LAMP:
        center_nm: 550
        fwhm_nm: 300
        note: "Broadband approximation. Quantitative calculation needs a measured spectrum"

  # ══════════════════════════════════════════════════════════════════════
  # Optical tweezers — a perturbation source, not illumination, but shares the light path
  # ══════════════════════════════════════════════════════════════════════
  Trap:
    model: "(unconfirmed) optical tweezers laser"
    note: >
      The `OT<value>` token in folder names (0.005 ~ 0.2) looks like a power
      setting.
      Not registered as an MM device, so it leaves no trace in the metadata.
      If it is 1064 nm, check (a) local heating from water absorption and
      (b) leakage into the detection path — the reason the optics gate holds its
      grid out to 1100 nm.
    lines:
      IR1064:
        center_nm: 1064
        fwhm_nm: 2
        max_power_mw: null
        power_at_sample_mw: {}
