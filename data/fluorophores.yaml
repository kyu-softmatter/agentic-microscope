# Fluorophore registry.
#
# ── Schema ────────────────────────────────────────────────────────────────
# fluorophores:
#   <canonical-name>:
#     aliases:          [other names used in folder names and protocols]
#     abs_peak_nm:      absorption peak
#     abs_fwhm_nm:      absorption FWHM   (used only when curves is absent)
#     em_peak_nm:       emission peak
#     em_fwhm_nm:       emission FWHM     (used only when curves is absent)
#     ext_coeff_M1cm1:  molar extinction coefficient ε
#     quantum_yield:    fluorescence quantum yield Φ
#     lifetime_ns:      fluorescence lifetime
#     photostability:   low | medium | high
#     curves:                       ← if present, this always takes priority
#       absorption: <file under data/spectra/>
#       emission:   <file under data/spectra/>
#     verified:         true means measured/datasheet verification is complete
#     note:             cautions
#
# ── Important ─────────────────────────────────────────────────────────────
# The values below are all **catalog nominal values** and `verified: false`.
# parametric band(peak+FWHM) gets the peak position right but **the wings wrong.**
# Crosstalk and excitation blocking verdicts are decided entirely by the wings,
# so before issuing a final verdict you must put measured spectra in data/spectra/.
# When gates compute without curves they downgrade confidence to low.
#
# Most spectra can be downloaded as csv from FPbase(https://www.fpbase.org).

fluorophores:

  # ── 647 series ───────────────────────────────────────────────────────────
  AlexaFluor647:
    aliases: [AF647, Alexa647, "Alexa Fluor 647"]
    abs_peak_nm: 650
    abs_fwhm_nm: 38
    em_peak_nm: 668
    em_fwhm_nm: 44
    ext_coeff_M1cm1: 270000
    quantum_yield: 0.33
    lifetime_ns: 1.0
    photostability: high
    verified: false
    note: >
      ⚠ The molar extinction coefficient differs by reactive-group species even
      across Thermo's own product pages (NHS ester 270000 / maleimide 265000 /
      hydrazide 250000; the old Handbook figure was 239000). The value above is
      for the NHS ester. No measured curve found — check FPbase(automated fetch
      is blocked) or Thermo SpectraViewer(JS app, automated fetch times out)
      directly in a browser.

  ATTO647N:
    aliases: [Atto647, Atto647N, "ATTO 647N"]
    abs_peak_nm: 644
    abs_fwhm_nm: 38
    em_peak_nm: 669
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 150000
    quantum_yield: 0.65
    lifetime_ns: 3.5
    photostability: high
    verified: false
    note: >
      Strongly hydrophobic, so it tends to adsorb non-specifically onto surfaces
      and hydrophobic domains. In ATPS experiments this can distort the phase
      partitioning itself, so check it in the sample geometry & optics lens.

      644/669 nm, ext_coeff 150000, QY 0.65 are triple-confirmed across
      FluoroFinder, Dempsey 2011, and fluorophores.tugraz.at(substance/763).
      Only AAT Bioquest's NHS ester datasheet lists absorption differently at
      663 nm, which looks like a typo on their side. lifetime_ns=3.5 could not
      be re-confirmed in this survey (the University of Arizona source page is
      dead at the DNS level) — the existing value is kept, follow-up validation
      needed. No measured curve found (the tugraz detail page keeps returning a
      500 error).

  SYTO61:
    aliases: [SYTO61, "SYTO 61", "SYTO-61"]
    abs_peak_nm: 628
    abs_fwhm_nm: 30
    em_peak_nm: 645
    em_fwhm_nm: 35
    quantum_yield: 0.18
    photostability: medium
    verified: false
    note: >
      Nucleic-acid-binding dye. The 628/645 nm and QY 0.18 above (relative
      measurement against cresyl violet, ~100 bp DNA : 1 dye) come from the
      manufacturer's primary document (Molecular Probes MP 11340, Table 1) —
      they differ from the secondary aggregator sites (tugraz 618/650,
      FluoroFinder 615/648), so trust the primary document. The molar extinction
      coefficient could not be found anywhere (even the manufacturer only gives
      a lumped ">50000" for the entire SYTO family, with no per-dye table).
      Free-dye fluorescence before binding is only described as very low, with
      no quantitative value. The full spectrum document (TD 11341) could not be
      obtained because its original URL is dead — worth having a human look for
      it. No measured curve.

  Cy5:
    aliases: [cy5]
    abs_peak_nm: 649
    abs_fwhm_nm: 40
    em_peak_nm: 670
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 250000
    quantum_yield: 0.27
    lifetime_ns: 1.0
    photostability: medium
    verified: false
    note: >
      Photoisomerization(cis-trans) causes blinking. It can break trajectories
      in single-particle tracking. The quantum yield varies from 0.20 to 0.28
      by source (AAT Bioquest 0.2 / FluoroFinder 0.27 / Dempsey 2011 0.28); no
      measured curve found — see the FPbase spectrum viewer (automated fetch is
      blocked, check directly in a browser) or fluorophores.tugraz.at/substance/655.

  # ══ AbvigenRed — DELIBERATELY NOT A REGISTRY ENTRY (2026-09-06) ═══════════
  #
  # This dye has NO spectral information left. Both peaks the vendor published
  # are now measured to be wrong (excitation 2026-09-05, emission 2026-09-06),
  # the widths were never anything but DragonGreen's values borrowed to make a
  # curve, and nothing has replaced them.
  #
  # It was briefly kept as an entry with all four spectral fields null, on the
  # reasoning that a channel naming it should fail loudly rather than compute
  # crosstalk from disproved numbers. That was wrong in ONE respect and it is
  # worth recording why: `optics.components.fluorophores()` builds EVERY entry
  # eagerly, so a member with no absorption band raises at registry-load time
  # and breaks every channel config in the repository, including the ones that
  # never mention this dye. A registry of spectra cannot hold a member with no
  # spectrum.
  #
  # So the dye is absent here, and the knowledge lives where it belongs:
  #   data/particles.yaml > abvigen-red-5um-cooh > emission_measured
  #     -- the four-band measurement, its anti-Stokes controls, and what it
  #        does and does not establish
  #   kb/calibrations/frame-photometry.yaml
  #     -- the frame it came from
  #
  # Channels that need a spectrum for this bead name an explicit stand-in
  # (`dye: TRITC`) so the substitution is visible in the channel file rather
  # than hidden in this registry. Restore an entry here only when a real
  # spectrum exists to put in it.
  #
  # The original entry follows, commented, for its reasoning.
  #
  #AbvigenRed:
  #  # RENAMED from `AbvigenRed680` on 2026-09-06. The old key asserted an
  #  # emission peak that has now been measured to be wrong, and a name is not
  #  # a place to keep a disproved number.
  #  aliases: ["Abvigen red bead dye", "AFR-0500 dye", "AbvigenRed680"]
  #  abs_peak_nm: null             # vendor's 620 disproved 2026-09-05; not replaced by a guess
  #  em_peak_nm: null              # vendor's 680 disproved 2026-09-06; band bracketed, peak not located
  #  abs_fwhm_nm: null
  #  em_fwhm_nm: null
  #  photostability: unknown
  #  verified: false
  #  measured_emission_bands:
  #    date: 2026-09-06
  #    method: >
  #      config/session/measure_red_bead_em1.py -- red beads only on the
  #      coverslip, Aura GREEN at 50/1000 (= 5%), 33.33 ms, 4x/0.20, Kinetix_red
  #      in DynamicRange 16-bit, camera post-processing OFF. Signal is the mean
  #      residual after subtracting each frame's own Gaussian-smoothed
  #      background, over the 226,413 px belonging to ~20,800 compact objects
  #      detected in BOTH of two 555 passes. Order 555 -> 405 -> 488 -> 647 ->
  #      555, so the repeat brackets time.
  #    excitation: "MXR00724-EX 544-565 nm band (Aura GREEN)"
  #    bands:   # net passband = FF01 filter AND the MXR00724 cube band it sits in
  #      "414-450": {filter: "FF01-432/36", signal_adu: 0.1,   snr: 0.1,  ratio_to_555: 0.000}
  #      "510-530": {filter: "FF01-515/30", signal_adu: 1.6,   snr: 0.7,  ratio_to_555: 0.004}
  #      "589-610": {filter: "FF01-595/31", signal_adu: 362.1, snr: 18.6, ratio_to_555: 1.000}
  #      "677-701": {filter: "FF01-680/42", signal_adu: 62.3,  snr: 14.0, ratio_to_555: 0.172}
  #    time_bracket_555b_over_555a: 1.016
  #    repeats: [0.161, 0.165, 0.170, 0.172]   # 647/555 across four runs
  #    verdict: >
  #      THE VENDOR'S 680 nm EMISSION PEAK IS WRONG. 589-610 nm is 5.8x stronger
  #      than 677-701 nm, and the two anti-Stokes bands -- 414-450 and 510-530,
  #      both BLUEWARD of the 544-565 excitation and so physically unable to
  #      carry fluorescence -- read 0.1 and 1.6 ADU at SNR 0.1 and 0.7. Those
  #      controls are what make the rest quantitative: the method's floor is
  #      0.4% of the 555 signal, so the 677-701 reading at 17.2% is 43x above
  #      the floor and is REAL emission, not leakage. One broad rhodamine-class
  #      emitter with a red tail, not two populations.

  #      WHAT THIS DOES NOT ESTABLISH: the peak. Four bandpasses bracket, they
  #      do not locate, and 589-610 catches the flank of anything peaking
  #      between ~570 and ~610. So `em_peak_nm` stays null, and channels that
  #      need a spectrum use an explicit named stand-in (TRITC) rather than a
  #      number invented here -- see
  #      config/channels/aura-widefield-green-red-2color.yaml. A real spectrum
  #      is still the only thing that fills these fields in.
  #    verified: true
  #  note: >
  #    ⚠ NOT A NAMED DYE. This is the unidentified proprietary colourant inside
  #    Abvigen's red fluorescent polystyrene beads
  #    (data/particles.yaml > abvigen-red-5um-cooh, cat AFR-0500-COOH). It exists
  #    as an entry only so that particle's channel can be evaluated at all —
  #    registered by the same reasoning as DragonGreen below, which is likewise a
  #    proprietary bead colourant with published peaks and nothing else.

  #    PUBLISHED, AND BOTH NOW DISPROVED: the vendor product page gives 620 nm
  #    excitation and 680 nm emission. The 2026-09-05 instrument test killed the
  #    first (observed GREEN > CYAN >> RED, the reverse of a 620 nm peak, with
  #    RED producing nothing at all) and the 2026-09-06 four-band test above
  #    killed the second. The page was already internally inconsistent — filed
  #    as "Monoclonal Antibody", with the product name sitting in its "Particle
  #    Size" field — so this is its third and fourth independent failure. NOTHING
  #    on it is load-bearing.

  #    ⚠ THE FOUR SPECTRAL FIELDS ARE NOW null, AND THAT IS AN UPGRADE. They
  #    previously held 620/680 plus 40/45 nm widths, and the widths were generic
  #    bead-dye values carried over from the DragonGreen entry purely so a
  #    parametric spectrum could be constructed — never this dye's measured
  #    widths. Emptying them costs nothing real and stops the disproved peaks
  #    propagating: a channel that names this key now fails to build a spectrum
  #    loudly instead of computing crosstalk from two wrong numbers. The vendor
  #    publishes no width, no curve, no extinction coefficient, no quantum yield
  #    and no lifetime, and none of those are measured here either.

  #    ⚠ Do NOT substitute a 647-class dye (AlexaFluor647 / ATTO647N / Cy5) for
  #    this. They are optically close and it would compute, but which colourant
  #    is in the bead is a chemical fact and is not ours to assign — the same
  #    rule stated at the head of
  #    config/channels/particle647-yoyo1-2color.yaml. The 60 nm Stokes shift here
  #    is notably wider than any of those, which is itself a hint that it is not
  #    one of them.

  # ── 488/green series ─────────────────────────────────────────────────────
  AlexaFluor488:
    aliases: [AF488, Alexa488, std488]
    abs_peak_nm: 495
    abs_fwhm_nm: 35
    em_peak_nm: 519
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 73000
    quantum_yield: 0.92
    lifetime_ns: 4.1
    photostability: high
    verified: false
    note: "Confirm whether `std488` is this dye — a folder-name token alone cannot identify it."

  FITC:
    aliases: [fitc, MQFITC]
    abs_peak_nm: 495
    abs_fwhm_nm: 35
    em_peak_nm: 519
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 75000
    quantum_yield: 0.92
    lifetime_ns: 4.1
    photostability: low
    verified: false
    note: >
      Strongly pH dependent (pKa≈6.4). At pH 6 the brightness drops sharply
      compared to pH 8. Photobleaching is also fast, so it is unsuitable for
      long-duration imaging other than FRAP.

      data/spectra/fitc_abs.txt and fitc_em.txt hold PhotochemCAD measured
      curves, but they are not FITC — they were taken on the parent fluorophore
      fluorescein in a basic ethanol solvent, so the emission peak sits at
      540 nm, pushed more than 20 nm to the red relative to aqueous FITC
      (519 nm). The solvent mismatch could distort the crosstalk calculation
      instead of helping, so they are not wired up under curves: by default.
      If you want to use them for a calculation where the wing shape matters
      more than the peak position (blocking OD, etc.), review them yourself
      first and then wire them up.

  EGFP:
    aliases: [GFP, egfp]
    abs_peak_nm: 488
    abs_fwhm_nm: 40
    em_peak_nm: 507
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 56000
    quantum_yield: 0.60
    lifetime_ns: 2.6
    photostability: medium
    verified: false

  AcridineOrange:
    aliases: [AO488, AO]
    abs_peak_nm: 500
    abs_fwhm_nm: 45
    em_peak_nm: 526
    em_fwhm_nm: 55
    ext_coeff_M1cm1: 53000
    quantum_yield: 0.20
    lifetime_ns: 2.0
    photostability: low
    verified: false
    note: >
      ⚠ Emission shifts drastically with binding state (DNA-bound ~490-502/
      520-530 nm green, RNA/acidic-vesicle-bound ~460/640-650 nm red). Modeling
      it with a single spectrum gets it wrong. For crosstalk calculations against
      the 647 channel you must use measured spectra. lifetime_ns=2.0 is the ISS
      table value (phosphate buffer, pH 7.8).

      data/spectra/acridineorange_abs.txt and _em.txt hold PhotochemCAD measured
      curves, but they are free-dye spectra in a basic ethanol solvent — the
      absorption peak sits at 431 nm, off by more than 60 nm from the aqueous
      DNA-bound spectrum (~490-502 nm). Using them for excitation efficiency
      calculations would be badly wrong instead of helpful, so they are not
      wired up under curves:.

  ATTO488:
    aliases: [Atto488, "ATTO 488"]
    abs_peak_nm: 500
    abs_fwhm_nm: 30
    em_peak_nm: 520
    em_fwhm_nm: 40
    ext_coeff_M1cm1: 90000
    quantum_yield: 0.80
    lifetime_ns: 4.1
    photostability: high
    verified: true
    curves:
      absorption: atto488_abs.txt
      emission: atto488_em.txt
    note: >
      Official ATTO-TEC/Leica datasheet values (PBS, pH 7.4). The measured
      curves were downloaded from a file the manufacturer published directly
      (downloads.leica-microsystems.com) — of the dyes obtained this round, the
      only genuine measured curve that matches even the state (aqueous).

  DragonGreen:
    aliases: ["Dragon Green", DragonGreen]
    abs_peak_nm: 480
    abs_fwhm_nm: 40
    em_peak_nm: 520
    em_fwhm_nm: 45
    photostability: unknown
    verified: false
    note: >
      ⚠ A Bangs Laboratories proprietary dye for bead staining — neither the CAS
      number nor the chemical structure is published. All that can be confirmed
      is the phrasing in the manufacturer datasheet (PDS 704, DG06M catalog):
      "480/520 nm, a substitute compatible with fluorescein filter sets". The
      molar extinction coefficient, quantum yield, and lifetime are published
      nowhere — do not substitute fluorescein/FITC values (the manufacturer only
      says "similar substitute", never that they are identical). bangslabs.com
      blocks all automated fetches with 403; if needed, have a human check the
      technical-library page directly in a browser.

  YOYO1:
    aliases: ["YOYO-1", "YOYO 1"]
    abs_peak_nm: 491
    abs_fwhm_nm: 25
    em_peak_nm: 509
    em_fwhm_nm: 30
    ext_coeff_M1cm1: 98900
    quantum_yield: 0.52
    lifetime_ns: 3.5
    photostability: medium
    verified: false
    note: >
      ⚠ All values above are for the dsDNA-bound state (Thermo MAN0001843,
      Table 1). Free YOYO-1 is effectively non-fluorescent (QY<0.1%, enhanced
      more than 500x-1000x on binding), so there are no separate free-form
      parameters — if you have to model a sample containing unbound dye, treat
      it as non-fluorescent.

      Binding stoichiometry: bis-intercalation, ~1 dye : 3.5-4 bp at saturation
      (Rye 1992; Molecules 2021, 26, 3748). Binding to dsDNA lengthens the
      contour length — Kundukad 2014(Soft Matter) reports +38% at saturating
      binding (1:4 bp) (328→453 nm for 1000 bp), and Günther 2010(magnetic
      tweezers, 1:3.2 bp) reports +47%. On persistence length the literature
      splits: one side says it barely changes at equilibrium (AFM/magnetic
      tweezers), the other that it appears to decrease because free dye
      redistributes out of equilibrium when stretched with optical tweezers
      (discussion in Kundukad 2014) — if you design an optical-tweezers DNA
      stretching experiment, keep this non-equilibrium artifact in mind. No
      measured spectrum curve found.

  # ── 555/TRITC series ─────────────────────────────────────────────────────
  TRITC:
    aliases: [TRITC555, tritc]
    abs_peak_nm: 547
    abs_fwhm_nm: 38
    em_peak_nm: 573
    em_fwhm_nm: 45
    ext_coeff_M1cm1: 85000
    quantum_yield: 0.28
    photostability: medium
    verified: false

  AlexaFluor555:
    aliases: [AF555, Alexa555, "Alexa Fluor 555"]
    abs_peak_nm: 555
    abs_fwhm_nm: 35
    em_peak_nm: 565
    em_fwhm_nm: 40
    ext_coeff_M1cm1: 155000
    quantum_yield: 0.10
    lifetime_ns: 0.3
    photostability: high
    verified: false
    note: >
      For the free (unconjugated) dye. The molar extinction coefficient differs
      slightly between sources: 155000 in Wikipedia/AAT Bioquest, 150000 in
      Berlier 2003(primary literature). QY 0.10 and lifetime 0.3 ns broadly
      agree with Wikipedia and with the re-measured value in Gebhardt 2021
      (ChemPhysChem) (0.33-0.35 ns). Photostability is much better than Cy3
      (after 95 s of irradiation, Cy3 ~75% vs AF555 ~90% remaining, Berlier
      2003). No measured curve found — the Thermo SpectraViewer and AAT Bioquest
      viewers are both JS-only so automated fetch is impossible; check directly
      in a browser.

  ATTO550:
    aliases: [Atto550, "ATTO 550"]
    abs_peak_nm: 554
    abs_fwhm_nm: 30
    em_peak_nm: 576
    em_fwhm_nm: 40
    ext_coeff_M1cm1: 120000
    quantum_yield: 0.80
    lifetime_ns: 3.6
    photostability: high
    verified: true
    curves:
      absorption: atto550_abs.txt
      emission: atto550_em.txt
    note: >
      ⚠ The requested "ATTO 555" could not be confirmed as a real product in this
      survey — the name appears neither in the current ATTO-TEC/Leica catalog nor
      in the Jena Bioscience table that lists every dye (550 and 565 are there).
      ATTO-TEC promotes ATTO 550 directly as an "Alexa Fluor 555 substitute", so
      on the judgment that the "555" request most likely pointed at this dye it is
      registered under the name ATTO550. What was actually wanted may have been
      ATTO 565, or fluorophores.tugraz.at/substance/239 (listed as "ATTO 555" at
      553/568 nm; the detail page returns a 500 error so its identity is
      unconfirmed), so confirm and add an alias or a separate entry if needed.
      The measured curves were obtained from the official ATTO-TEC/Leica file
      (PBS).

  # ── Conjugates ───────────────────────────────────────────────────────────
  # The entries below are folder-name tokens, not dye names. Until the actual
  # fluorophore is pinned down, the gates return BLOCKED.
  SA647:
    aliases: ["Streptavidin-647"]
    abs_peak_nm: 650
    abs_fwhm_nm: 38
    em_peak_nm: 668
    em_fwhm_nm: 44
    ext_coeff_M1cm1: 270000
    quantum_yield: 0.33
    photostability: high
    verified: false
    note: >
      ⚠ Fluorophore not yet determined. Provisionally filled in with Alexa 647
      values. Need to confirm whether the actual product is Alexa Fluor 647 /
      ATTO 647N / DyLight 650. The number of fluorophores per streptavidin
      molecule (DOL) also changes brightness by a factor of several.

  DEX647:
    aliases: ["Dextran-647"]
    abs_peak_nm: 650
    abs_fwhm_nm: 38
    em_peak_nm: 668
    em_fwhm_nm: 44
    ext_coeff_M1cm1: 270000
    quantum_yield: 0.33
    photostability: high
    verified: false
    note: >
      ⚠ Fluorophore and molecular weight not yet determined. The dextran molecular
      weight (3k/10k/70k/500k) determines ATPS phase partitioning and the
      diffusion coefficient, so it is required information for FRAP and
      partitioning experiments.

  Phal647:
    aliases: ["Phalloidin-647"]
    abs_peak_nm: 650
    abs_fwhm_nm: 38
    em_peak_nm: 668
    em_fwhm_nm: 44
    ext_coeff_M1cm1: 270000
    quantum_yield: 0.33
    photostability: high
    verified: false
    note: >
      ⚠ Fluorophore not yet determined. Phalloidin **stabilizes** actin filaments —
      in actin rheology measurements that is a perturbation which changes the very
      thing being measured. Must be checked in the sample geometry & optics lens.
