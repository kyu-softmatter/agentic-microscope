  # ══════════════════════════════════════════════════════════════════════
  # Current system — measured in NIS-Elements Device Manager (2026-08-10)
  # See filter_turrets / optical_path_nis in kb/systems/current.md.
  # Each range is the dialog's "From X To Y nm" readout copied verbatim; bands:
