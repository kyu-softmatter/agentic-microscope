  # ══════════════════════════════════════════════════════════════════════
  # 현재 시스템 — NIS-Elements Device Manager 실측 확인 (2026-08-10)
  # kb/systems/current.md의 filter_turrets / optical_path_nis 참고.
  # 각 range는 다이얼로그의 "From X To Y nm" 표시를 그대로 옮긴 것. bands: 는
  # 그 표시값을 [center, fwhm]로 산술 변환한 것뿐이고, 다이크로익 항목에서
  # 그게 반사대역인지 통과대역인지는 부품별로 다르다 — 파일 상단 "중요" 문단
  # 대로 vendor 곡선 대조 전까지 triage 전용으로만 쓸 것.
  # ══════════════════════════════════════════════════════════════════════

  "MXR00724-EX":
    kind: multiband
    vendor: Nikon
    part_number: MXR00724
    bands: [[378, 50], [474, 24], [554.5, 21], [635, 16], [735, 26]]
    position: excitation
    removable: true
    purpose: "5-band 큐브(DAPI/FITC/TRITC/Cy5/Cy7)의 exciter — Ti2 FilterTurret1 position 1"
    note: >
      NIS-Elements 'Excitation' 표시값: 353-403, 462-486, 544-565, 627-643,
      722-748 nm. ⚠ 2026-08-10: exciter/emitter는 다이크로익과 달리 큐브
      프레임에서 개별 교체 가능한 별개 유닛이다 — 큐브 전체를 통으로 취급하지
      말 것. ablation 분석에서도 독립적으로 뺄 수 있는 요소로 판단한다
      (`removable: false`였던 이전 값은 틀렸음).
    verified: true

  "MXR00724-DM":
    kind: multiband
    vendor: Nikon
    part_number: MXR00724
    bands: [[432, 36], [514.5, 31], [595.5, 31], [681, 40], [808.5, 81]]
    position: shared
    removable: false
    purpose: "5-band 큐브(DAPI/FITC/TRITC/Cy5/Cy7)의 다이크로익 — Ti2 FilterTurret1 position 1"
    note: >
      NIS-Elements 'Mirror' 표시값: 414-450, 499-530, 580-611, 661-701,
      768-849 nm. 반사대역인지 통과대역인지 미확정 — vendor 곡선 대조 필요.
    verified: true

  "MXR00724-EM":
    kind: multiband
    vendor: Nikon
    part_number: MXR00724
    bands: [[440, 40], [520.5, 21], [606, 34], [694, 34], [808.5, 81]]
    position: emission
    removable: true
    purpose: "5-band 큐브(DAPI/FITC/TRITC/Cy5/Cy7)의 emitter — Ti2 FilterTurret1 position 1"
    note: >
      NIS-Elements 'Emission' 표시값: 420-460, 510-531, 589-623, 677-711,
      768-849 nm. ⚠ 2026-08-10: exciter/emitter는 다이크로익과 달리 큐브
      프레임에서 개별 교체 가능한 별개 유닛이다 — 큐브 전체를 통으로 취급하지
      말 것. ablation 분석에서도 독립적으로 뺄 수 있는 요소로 판단한다
      (`removable: false`였던 이전 값은 틀렸음).
    verified: true

  "Di01-T405/488/568/647-13x15x0.5":
    kind: dichroic
    vendor: Semrock
    part_number: "Di01-T405/488/568/647-13x15x0.5"
    # 단일 광대역 "band"로 flat top을 표현하는 트릭. center/fwhm이 격자
    # (300-1100nm) 밖까지 넉넉히 걸쳐 있어 격자 전체가 평평한 top에 들어간다.
    # 목적은 물리가 아니라 measured=False 플래그다 — Spectrum.constant()로
    # 만들면 "측정됨"으로 잘못 표시된다 (아래 참고).
    bands: [[700, 1000]]
    peak_transmission: 0.90
    reflection:
      bands: [[405, 2], [488, 2], [564.5, 7], [640, 14]]
      peak_transmission: 0.92
    position: shared
    removable: false
    purpose: "405/488/561/640 4-라인 레이저 여기/방출 분리 — NIS 'DM'(CSU-W1 경로), position 1. LUN-F-XL 레이저 라인과 대응"
    note: >
      NIS-Elements 'Mirror' 표시값: 404-406, 487-489, 561-568, 633-647 nm —
      Di01-T 시리즈 특성상 각 레이저 라인에서만 좁게 반사(notch)하고 나머지는
      광대역으로 투과하는 노치 다이크로익이다 (MXR00724-DM과 폭이 다른 이유).

      ⚠ 2026-08-10 정정: 이전 항목은 `kind: multiband` + 최상위 `bands:`에 이
      반사대역을 직접 넣었다. 이 파일의 규약상 최상위 `bands`/`center_nm`은
      **투과대역**이고 `kind: dichroic|mirror`가 아니면 반사율 자동유도(1-T)도
      안 걸리므로, 실제로는 `optics/components.py`가 이 소자를
      "4개 레이저 라인에서만 통과, 그 사이는 전부 6 OD 차단"하는 요소로
      계산했다 — 노트에 적힌 실제 동작과 정반대다. 그 결과 이 다이크로익을
      쓰는 모든 채널에서 방출 스펙트럼이 거의 전부 잘려나가 여기결합·방출수집이
      허구로 0에 가깝게 나왔다 (CSU-W1/LUN-F-XL 레이저 경로 전체가 영향받음).
      `reflection:`로 반사대역을 분리하고 최상위는 광대역 투과로 바꿨다.
      투과 0.90 / 반사 0.92는 Semrock Di01-T 시리즈 전형값이며 실측 아님 —
      vendor 곡선 확보 전까지 근사(고로 measured=False 유지, 위 참고).
    verified: true

  "DM A561LP":
    kind: dichroic # longpass였던 것을 dichroic으로: reflection이 1-T로 자동
    # 유도되게 함. 단일 edge라 이 근사가 합리적 (Di01-T 같은 다중 노치와 다름).
    # 디테일(실측 곡선 등)은 추후 보정.
    edge_nm: 561
    position: shared
    removable: true
    purpose: "561 nm 기준 듀얼 카메라 채널 분리 — NIS 'Splitter', position 1 (kb/systems/current.md)"
    note: >
      2026-08-10 사용자 확인: 현재 Splitter가 이 위치(다이얼 표시 "position 2",
      kb/systems/current.md의 0-index로는 1)에 있고 카메라 2대(Kinetix_red/
      Kinetix_blue) 동시 사용 중. Kinetix_red = 투과측(>561nm, 긴 파장),
      Kinetix_blue = 반사측(<561nm, 짧은 파장) — 이름이 곧 배정과 일치한다.
    verified: true

