    peak_transmission: 0.93
    blocking_od: 6
    position: emission
    purpose: "EM1/EM2 position 0 (label \"multi\") — quad-band emitter carrying all four single bands. The robust dual-camera starting configuration"
    note: >
      ✅ Registered 2026-09-06 on the operator's statement that "pass band of
      multi band filter are just some of other four", together with the earlier
      "multiband filter including all of these". Taken together: this part's
      passbands ARE the four single-band passbands above, all four present.

      That is why `bands:` is written as the union of the four rather than left
      unknown. This entry was deliberately `kind: unknown` for one revision
      precisely because a quad emitter's bands are USUALLY chosen separately
      from its single-band siblings' and commonly shift and widen — so the
      union would have been a guess. It is now an operator statement instead.

      ⚠ Residual caveat, small but real: band EDGES on a multiband part are
      still typically a little different from the single-band equivalents even
      when the nominal centres match, and no part number is on record to check
      against. Blocking and crosstalk are decided in exactly those edges. Get
      the part number.

      ── ⚠ DO NOT USE THIS POSITION FOR THE TWO-COLOUR WORK ──────────────

      An earlier revision of this note recommended the quad in BOTH wheels as
      the robust starting configuration, on the reasoning that the splitter
      alone would classify while the emitter supplied the blocking, and that the
      red arm would then catch the red bead in either candidate band. The
      collection arithmetic for that is real — in the red arm this passes 50.8%
      of a 680 nm emitter and 46.3% of a 590 nm one, so it is robust to the
      unknown in a way neither single band is. **But `optics.cli check` refuses
      it, and it is right to.**

        quad in both arms:  INFEASIBLE, spectral.overlap 0.00,
                            Stokes headroom −74 nm (green) / −60 nm (red),
                            blocking 5.49 / 5.51 OD
        515/30 + 680/42:    HARD, blocking.insufficient 0.87,
                            Stokes headroom +12 / +19 nm, blocking 6.09 / 6.11 OD

      The reason is structural and applies to any multiband emitter here: **every
      excitation line this scope has sits with at least one of the quad's four
      passbands BLUEWARD of it.** Exciting at 488 with 414-450 nm open, or at 640
      with 579-610 nm open, means the detection path accepts a window on the
      anti-Stokes side of the line. Nothing legitimate arrives there, but
      backscatter, Raman and any other laser line that happens to be on do — and
      the extra open area also costs 0.6 OD of blocking outright.

      A multiband emitter belongs in a path that excites all its bands at once
      and reads them on ONE detector, sequentially. This path splits at 561 nm
      and reads two detectors simultaneously, so the split already does what the
      multiband is for, and the multiband can only add windows nobody wants.

      **Use the single bands.** The robustness that motivated the quad is better
      had by moving the red wheel between positions 3 and 4 across two
      acquisitions — a two-second wheel move that also MEASURES which band the
      red dye is in, instead of papering over not knowing.
    verified: true

