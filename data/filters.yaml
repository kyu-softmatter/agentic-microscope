# Filter / dichroic / path-element registry.
#
# ── 스키마 ────────────────────────────────────────────────────────────────
# filters:
#   <name>:
#     kind:  bandpass | multiband | longpass | shortpass | dichroic |
#            mirror | nd | polarizer | window
#     vendor / part_number
#     # 통과대역 지정 방법 (위에서부터 우선)
#     curve:            <data/spectra/ 아래 2열 파일>   ← 가장 정확
#     bands:            [[center, fwhm], ...]           ← multiband
#     center_nm / fwhm_nm                               ← 단일 bandpass
#     edge_nm / transition_nm                           ← long/short pass, dichroic
#     od:               <ND만>
#     peak_transmission: 0-1 (기본 0.95)
#     blocking_od:      대역 밖 차단 (기본 6)
#     reflection:       {curve|bands|...}  ← dichroic 반사율을 따로 줄 때
#     removable:        false 면 ablation 대상에서 제외 (구조물)
#     purpose:          왜 경로에 있는지 (제거 제안의 근거가 됨)
#     position:         excitation | emission | shared
#
# ── 중요 ──────────────────────────────────────────────────────────────────
# parametric(center/fwhm/edge)은 **triage 전용**이다. 실제 필터의 edge는
# 훨씬 가파르고 blocking은 파장 의존적이다. 여기 쓰는 `blocking_od: 6` 평탄
# 바닥은 먼 날개에서 낙관적이다. 판정을 확정하려면 vendor 곡선을 받아
# data/spectra/ 에 넣고 `curve:` 로 연결할 것.
# Semrock/IDEX와 Chroma 모두 사이트에서 txt로 곡선을 제공한다.

filters:

  # ══════════════════════════════════════════════════════════════════════
  # 현재 시스템에서 실제로 관찰된 것 — 전부 미확정
  # ══════════════════════════════════════════════════════════════════════
  "DA/FI/TR10Empty":
    kind: unknown          # ← 일부러 unknown. 게이트가 BLOCKED를 내도록.
    position: shared
    removable: false
    purpose: "FilterTurret1 위치 1의 유일한 큐브"
    note: >
      ⚠ 메타데이터 2,312건 전부 이 라벨이다. 이름은 DAPI/FITC/TRITC
      3-band 세트를 가리키는데 실제로는 647-Cy5 채널을 764건 촬영했다.
      3-band 큐브로는 647 nm 방출이 거의 통과하지 않는다.
      가능성: (a) 실제로는 4-band(DA/FI/TR/Cy5) 큐브인데 라벨이 잘림,
              (b) Wheel-A가 방출 선택을 하는데 위치 라벨이 없어 안 보임,
              (c) 라벨과 실물이 다름.
      → MM .cfg + 큐브 실물의 각인·부품번호 확인 전까지 광학 게이트는
        이 채널을 판정할 수 없다.
      → **2026-08-10 해소:** NIS-Elements Device Manager > Filter Block
        Settings - Turret1에서 위치 1(=MM 위치 0)의 실물을 확인했다. 정체는
        "MXR00724 - LED-DA/FI/TR/Cy5/Cy7-A", 5-band 큐브. 아래
        `MXR00724-EX`/`MXR00724-DM`/`MXR00724-EM` 세 항목이 그 구성요소다.
        이 항목(`kind: unknown`)은 legacy-observed.yaml이 의도적으로 BLOCKED를
        재현하는 데 쓰이므로 남겨두되, 실사용 채널 설정에는 새 항목을 쓸 것.

  "Wheel-A:Filter-0":
    kind: unknown
    position: emission
    purpose: "Sutter Lambda 필터휠 위치 0"
    note: >
      ⚠ 메타데이터 2,292건이 전부 `Filter-0`. MM config에 휠 위치 이름이
      등록되어 있지 않아 어떤 방출 필터였는지 복원 불가.
      → .cfg에 위치별 라벨을 등록하는 것이 가장 시급한 조치.
      → 2026-08-10 NIS-Elements에서 확인된 방출 필터휠 `EM1`(아래 참고)과
        동일 물리 장치일 가능성이 있으나 이름·위치 인덱스가 대조되지 않아
        미확인으로 남긴다.

