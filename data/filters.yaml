  # ══════════════════════════════════════════════════════════════════════
  "DA/FI/TR10Empty":
    kind: unknown          # ← unknown on purpose, so the gate returns BLOCKED.
    position: shared
    removable: false
    purpose: "The only cube in FilterTurret1 position 1"
    note: >
      ⚠ All 2,312 metadata records carry this label. The name points at a
      DAPI/FITC/TRITC 3-band set, but 764 frames were actually shot on 647-Cy5.
      A 3-band cube passes almost no 647 nm emission.
      Possible: (a) really a 4-band (DA/FI/TR/Cy5) cube with a truncated label,
              (b) Wheel-A does the emission selection but its positions are
                  unlabeled, so it is invisible,
              (c) the label and the physical part disagree.
      → Until the MM .cfg and the engraving/part number on the physical cube
        are checked, the optics gate cannot reach a verdict on this channel.
      → **Resolved 2026-08-10:** NIS-Elements Device Manager > Filter Block
        Settings - Turret1 confirmed the physical part in position 1 (= MM
        position 0). It is "MXR00724 - LED-DA/FI/TR/Cy5/Cy7-A", a 5-band cube.
        The three entries `MXR00724-EX`/`MXR00724-DM`/`MXR00724-EM` below are
        its components. Keep this entry (`kind: unknown`) since
        legacy-observed.yaml uses it to deliberately reproduce BLOCKED, but use
        the new entries for real channel configuration.

  "Wheel-A:Filter-0":
    kind: unknown
    position: emission
    purpose: "Sutter Lambda filter wheel position 0"
    note: >
      ⚠ All 2,292 metadata records read `Filter-0`. The MM config has no names
      registered for the wheel positions, so which emission filter it was cannot
      be recovered.
      → Registering per-position labels in the .cfg is the most urgent action.
      → It may be the same physical device as the emission filter wheel `EM1`
        confirmed in NIS-Elements on 2026-08-10 (see below), but the names and
        position indices have not been cross-checked, so it stays unconfirmed.

