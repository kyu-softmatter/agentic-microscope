  # ══════════════════════════════════════════════════════════════════════
  # Attenuation & polarization elements — the main targets of ablation analysis
  # ══════════════════════════════════════════════════════════════════════
  "ND-0.6":
    kind: nd
    od: 0.6
    position: excitation
    purpose: "Excitation light attenuation (25%)"
    note: >
      If the light source level can be turned down, the ND is unnecessary. But
      Lumencor's low-% range can be poorly linear, so attenuating with an ND and
      running the light source in its linear range is sometimes the more
      reproducible option. Judge this together with the detection lens.

  "ND-1.0":
    kind: nd
    od: 1.0
    position: excitation
    purpose: "Excitation light attenuation (10%)"

  "Polarizer-Linear":
    kind: polarizer
    peak_transmission: 0.42
    position: excitation
    purpose: "Polarizer for liquid-crystal polarization imaging"
    note: >
      Left in the path when the experiment is not a polarization one, it is a
      net 58% loss. The item ablation catches most often.

