  "ND-0.6":
    kind: nd
    od: 0.6
    position: excitation
    purpose: "Excitation light attenuation (25%)"
    note: >
      If the light source level can be turned down, the ND is unnecessary. But
      Lumencor's low-% range can be poorly linear, so attenuating with an ND and
      running the light source in its linear range is sometimes the more
      reproducible option. Judge this together with the detection lens.

