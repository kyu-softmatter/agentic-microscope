# Filter / dichroic / path-element registry.
#
# ── Schema ────────────────────────────────────────────────────────────────
# filters:
#   <name>:
#     kind:  bandpass | multiband | longpass | shortpass | dichroic |
#            mirror | nd | polarizer | window
#     vendor / part_number
#     # how to specify the passband (first listed wins)
#     curve:            <2-col file in data/spectra/>   ← most accurate
#     bands:            [[center, fwhm], ...]           ← multiband
#     center_nm / fwhm_nm                               ← single bandpass
#     edge_nm / transition_nm                           ← long/short pass, dichroic
#     od:               <ND only>
#     peak_transmission: 0-1 (default 0.95)
#     blocking_od:      out-of-band blocking (default 6)
#     reflection:       {curve|bands|...}  ← when giving the dichroic reflectance separately
#     removable:        false excludes it from ablation candidates (structural)
#     purpose:          why it is in the path (basis for removal proposals)
#     position:         excitation | emission | shared
#
# ── IMPORTANT ─────────────────────────────────────────────────────────────
# parametric (center/fwhm/edge) is **triage only**. A real filter's edge is
# far steeper and blocking is wavelength dependent. The flat `blocking_od: 6`
# floor used here is optimistic in the far wings. To settle a verdict, get the
# vendor curve, drop it into data/spectra/ and wire it with `curve:`.
# Both Semrock/IDEX and Chroma provide curves as txt on their sites.

filters:

  # ══════════════════════════════════════════════════════════════════════
