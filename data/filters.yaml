  "Di01-T405/488/568/647-13x15x0.5":
    kind: dichroic
    vendor: Semrock
    part_number: "Di01-T405/488/568/647-13x15x0.5"
    # Trick for expressing a flat top as a single wide "band". center/fwhm
    # straddle well beyond the grid (300-1100nm), so the whole grid sits on the
    # flat top. The point is not the physics but the measured=False flag —
    # building it with Spectrum.constant() wrongly marks it "measured" (see below).
    bands: [[700, 1000]]
    peak_transmission: 0.90
    reflection:
      bands: [[405, 2], [488, 2], [564.5, 7], [640, 14]]
      peak_transmission: 0.92
    position: shared
    removable: false
    purpose: "Separates excitation/emission for the 405/488/561/640 4-line laser — NIS 'DM' (CSU-W1 path), position 1. Matches the LUN-F-XL laser lines"
    note: >
      NIS-Elements 'Mirror' readout: 404-406, 487-489, 561-568, 633-647 nm —
      characteristic of the Di01-T series, this is a notch dichroic that reflects
      narrowly (notch) only at each laser line and transmits broadband elsewhere
      (which is why the widths differ from MXR00724-DM).

      ⚠ Correction 2026-08-10: the previous entry used `kind: multiband` plus
      these reflection bands put directly into the top-level `bands:`. By this
      file's convention the top-level `bands`/`center_nm` is the **passband**,
      and automatic reflectance derivation (1-T) only applies to
      `kind: dichroic|mirror`, so what actually happened is that
      `optics/components.py` computed this element as one that
      "passes only at the 4 laser lines and blocks everything between them at
      6 OD" — the exact opposite of the real behavior written in this note. As a
      result the emission spectrum was almost entirely cut away in every channel
      using this dichroic, and excitation coupling / emission collection came out
      fictitiously near 0 (the whole CSU-W1/LUN-F-XL laser path was affected).
      The reflection bands are now split out with `reflection:` and the top level
      is broadband transmission. Transmission 0.90 / reflection 0.92 are typical
      Semrock Di01-T series values, not measured — an approximation until the
      vendor curve is obtained (hence measured=False stays, see above).
    verified: true

  "DM A561LP":
    kind: dichroic # was longpass, now dichroic so reflection is auto-derived
    # as 1-T. Single edge, so the approximation is reasonable (unlike multi-notch
    # parts like Di01-T). Details (measured curve etc.) to be corrected later.
    edge_nm: 561
    position: shared
