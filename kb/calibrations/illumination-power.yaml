      RETRACTED 2026-09-09 by KH: these two readings were a measurement error.
      Kept rather than deleted because they were briefly load-bearing -- they
      reached SAFETY.md and two commits reasoned from them -- and a reader who
      saw them has to find the retraction next to them.

      TODO(human): what the error was. A correction is dense knowledge (09 §7)
      and this one is worth its line: knowing whether it was the level actually
      set, the head placement, stray IR, or something else is what stops the
      re-measurement repeating it. One candidate that fits arithmetically and is
      NOT offered as an answer: if the 4x row had really been taken near level
      70 rather than 20, 890 mW would sit within 1 % of the 20x's own linear
      curve.
    at_100pct_extrapolated_mw: 1275
    at_100pct_evidence: assumed
    note: >-
      The 20x by-level row below stands; only the two objective readings were
      retracted. Nothing else in this block depends on them.

      100 % WAS NOT MEASURED: it over-ranged the meter (KH, 2026-09-09), which
      is why 80 % is the top row. 1275 mW is 1020 x 100/80 and is `assumed`,
      not `measured` -- CLAUDE.md §3, so it may be computed with and may not
      advance a verdict. The extrapolation is well supported inside the
      measured range (64 mW at 5 % predicts 1020 at 80 % to 0.4 %) but 100 % is
      past the last reading, and a diode driver's last 20 % is exactly where a
      knee would sit. As a safety figure it is the conservative direction: a
      roll-over would put the true value below 1275, not above.

      The two objective readings are at level 20 %, not at the 80 % reference,
      so a comparison against 20x needs the 20x value at 20 % -- which was not
      taken. See `open_questions.ot_20x_at_20pct`.

# ---------------------------------------------------------------------------
# ILLUMINATED AREA -- NOT MEASURED
# ---------------------------------------------------------------------------
# Without it there is no W/cm^2, and W/cm^2 is what the gates consume. The
# magnification effect lives here, not in the power rows: total power above is
# flat to within 25 % across 4x/10x/20x, while area goes as 1/M^2, so 4x to 20x
# is a factor near 25. To be measured (KH, 2026-09-09).
# ⚠ AREA IS PER (SOURCE x OBJECTIVE), NOT PER OBJECTIVE. The three engines put
# different SHAPES on the sample (KH, 2026-09-09) and a single per-objective
# number cannot hold that. Keying it by objective alone was this file's error.
illuminated_area_um2:

  LUN-F-XL:
    shape: "approximately the camera field"
    evidence: computed
    basis: >-
      2400 x 2400 px at the MEASURED 20x pixel size 0.32373 um/px
      (data/pixel_size.yaml, 1x intermediate) = 777.0 x 777.0 um. Computed, not
      measured: the field was reported as matching the camera field closely, and
      "closely" was not quantified.
    "20x": 603654
    "4x": null      # 4x and 10x pixel sizes are `nominal`, so an area from them
    "10x": null     # would inherit that; not computed here for that reason
    irradiance_w_cm2_at_100pct_20x: {"488": 1.14, "561": 1.08, "640": 1.64}

  Spectra:
    shape: "rectangular -- the beam arrives through the DMD"
    evidence: computed
    basis: >-
      Shape is a rectangle set by the DMD, but its AREA is comparable to the
      camera field (KH, 2026-09-09), so the same 603,654 um^2 is used. Only the
      area enters the irradiance; the aspect ratio does not. "Comparable" was
      not quantified, which is the limit on this number.
    "20x": 603654
    "4x": null
    "10x": null
    irradiance_w_cm2_at_100pct_20x: {Cyan: 2.20, Green: 2.53, Red: 1.64}

  Aura:
    shape: "circular"
    evidence: computed
    basis: >-
      Checked with the field diaphragm (KH, 2026-09-09): the illuminated area is
      close to the camera field, so the same 603,654 um^2 applies. This revises
      the earlier report of an unrestricted circle -- unrestricted it is, and it
      lands at about the field anyway, so the illumination optics rather than a
      stop are what bound it.
    "20x": 603654
    "4x": null
    "10x": null
    irradiance_w_cm2_at_100pct_20x: {CYAN: 7.62, GREEN: 7.70, RED: 2.63}
    caveat: >-
      ⚠ The power rows were taken with nothing stopped down and the area was
      established afterwards with the diaphragm. Both describe the same beam
      only if closing the diaphragm to the field changed no power -- which
      follows if the beam was already about that size, and does not if it was
      not. Unquantified either way, like "close to the camera field" itself.

# ---------------------------------------------------------------------------
# WHAT THE ROWS SAY -- recompute from the rows; do not cite these figures
# ---------------------------------------------------------------------------
# MIRROR. T = (all_in)/(mirror_out) on the Spectra, nine independent readings:
#   470  0.439 / 0.433 / 0.434     (20x / 4x / 10x)
#   555  0.438 / 0.439 / 0.438
#   640  0.450 / 0.446 / 0.445
# Flat in wavelength and in objective, so ~0.44 is usable as one number. This
# is also the multiplicativity check that the reduced measurement design rested
# on, and it passes for the one element that could be switched.
#
# OBJECTIVE. Total power at 100 %, against 20x: Aura 0.98-1.04, LUN-F-XL
# 1.01-1.07, Spectra 1.09-1.25. The objective term is small; the area term is
# the whole magnification effect.
#
# LEVEL LINEARITY, measured/(top x fraction):
#   1064            1.00 0.99 0.99 0.99   linear over 5-80 %
#   Aura 555, 640   0.94-1.01             linear
#   Aura 488        1.30 at 5 %           over-delivers below ~10 %
#   Spectra 470,555 0.60-0.65 at 5 %      under-delivers below ~30 %
#   Spectra 640     1.62 at 5 %           a pedestal at low level: 0.8 mW at
#                                         5 % all_in and 2.0 mW mirror_out,
#                                         whose ratio 0.40 matches T_mirror, so
#                                         it is the source and not the meter
#   LUN-F-XL        0.31-0.87 at 30-50 %, unreadable at 5-10 %
# Above ~30 % every source except the LUN-F-XL is linear to a few percent.
#
# ⚠ 1064 AT THE SAMPLE PLANE: 1020 mW at 80 %, through the 20x. Over one watt
# of Class-4 1064. SAFETY.md §1 said this dial was uncalibrated; it is not any
# more. The 4x and 10x readings that once sat here were RETRACTED as a
# measurement error (KH, 2026-09-09) -- see the row's own retraction note. Every
# 1064 figure for an objective other than the 20x is now an estimate off a
# transmittance plot, not a reading.
#
# THE HEAD WAS NOT SATURATING, and the data shows it rather than assuming it:
# 64 mW at 5 % extrapolates linearly to 1024 mW at 80 %, and 1020 was measured.
# A compressing detector would have read distinctly low there. So 1020 mW is
# not an underestimate from compression. What a photodiode head does NOT settle
# is whether 1064 sits inside its calibrated range, and whether one watt was
# inside its damage rating -- see open_questions.head_model.

open_questions:
  head_rating: >-
    CLOSED (KH, 2026-09-09): the 1020 mW reading was within the S121C's normal
    range, so it is neither outside the calibrated range nor a damage event
    that would bias later readings. 100 % over-ranged it and was therefore not
    taken, which is consistent.

    The data agrees independently: 64 mW at 5 % predicts 1020 mW at 80 % to
    within 0.4 %, so the head was not compressing anywhere in that range.
  head_at_1064: >-
    The S121C is a SILICON element, so 1064 nm sits near its band edge -- inside
    the stated 400-1100 nm window, but at the end of it, where responsivity is
    small and falls steeply with both wavelength and temperature. The visible
    lines (470/555/640) sit in silicon's flat, well-calibrated region and are
    unaffected.

    So the 1064 ABSOLUTE figure is the least reliable number in this file. What
    is not affected: the 1064 linearity (a single scale factor cancels in
    measured/expected) and every ratio taken at one wavelength -- the mirror
    transmission and the objective comparisons.
  aura_line_identity: >-
    CLOSED as far as it can be (KH, 2026-09-09). The operator drove the NAMED
    lines, and "488 / 555 / 647" are this lab's convention for CYAN / GREEN /
    RED -- not device labels and not measured centres. So the power is filed
    under `named_lines_observed` in data/light_sources.yaml and NOT against the
    numeric keys, which that file has warned since 2026-09-03 are unverified
    and contradicted by the device. Its instruction is explicit: "Do NOT map a
    named line onto one of the numeric keys above by guessing." Knowing the
    lab's name for a line is not knowing its wavelength.

    STILL OPEN, and unchanged by this measurement: these three lines cannot
    feed a gate, because a photon budget needs both how many photons and at
    what wavelength, and only the first half now exists. A datasheet for the
    "Aura III 5-NII-WA" configuration, or a measured spectrum, supplies the
    other half -- and then the three rows move up into `lines:` intact.
  spectra_488: >-
    CONFIRMED (KH, 2026-09-09): the bench label "488" is the Spectra's Cyan at
    470 nm. That line's own note in data/light_sources.yaml already said it is
    the one used for the 488-GFP channel, so the two agree independently.
  ot_objective_method: >-
    DECIDED (KH, 2026-09-09): estimate the trap laser's objective dependence
    from the vendor transmittance curves, and re-measure the 4x and 10x later.
    SUPERSEDED THE SAME DAY on its premise: KH then established that the
    890 mW / 1050 mW readings were not merely suspect but WRONG -- a measurement
    error. So this is no longer "prefer the curve while two candidates
    disagree"; there is one candidate. The readings stay struck in the row
    above, and the re-measurement is now the only route to a measured value at
    those objectives rather than a tie-break.

    From the measured 20x (1020 mW at 80 %) times the curve ratio at 1000 nm,
    with the two 20x plots averaged (KH, 2026-09-09):

      4x    1.08 x   ->  1106 mW at 80 %
      40x   0.74 x   ->   750 mW
      60x   0.88 x   ->   902 mW
      100x  0.95 x   ->   966 mW

    All `estimated`, never `measured`: the transmittances were read off rendered
    plots by eye, the plots stop at 1000 nm, and 1064 is past them.

    ⚠ THE 40x WI PASSES THE LEAST NIR BY A CLEAR MARGIN, and its curve is still
    falling steeply where the plots end, so 1064 is likely below even 0.71. That
    matters because the 40x WI is the index-matched choice for aqueous samples
    (data/objectives.yaml), so the lens most attractive for trapping in water is
    also the one that delivers the least trap power. Nothing gates that today.

    ⚠ FIVE OF THE SIX OBJECTIVES NOW HAVE A 1064 FIGURE AND NONE OF THEM WAS
    MEASURED. Only the 20x row is a reading; the rest are that one reading times
    a ratio taken off a plot that stops 64 nm short. Adequate for a photon
    budget, not a substitute for a meter before an exposure decision -- and the
    retraction is what that caution is made of, the last 1064 numbers at another
    objective having been wrong by 3x. See SAFETY.md §1.
  ot_20x_at_20pct: >-
    One further reading would remove an extrapolation from a safety number: the
    20x at 20 %. Without it, the statement that 4x and 10x pass 3.5x and 4.1x
    more than the 20x rests on extrapolating the 20x from its 30 % reading.
    Two explanations have been checked and BOTH FAIL; recorded so that neither
    is proposed again. (a) Entrance pupil: 2*NA*f/M gives 20.0, 18.0 and 16.0 mm
    for 4x/10x/20x, so pupil area predicts 1.56x and 1.27x, and puts 4x above
    10x where the measurement puts 10x above 4x. (b) Objective IR transmission:
    the vendor curves for these lenses run to 1000 nm and are flat across the
    NIR at roughly 87 % for the 4x against 78-84 % for the 20x -- a ratio near
    1.1, an order of magnitude short of 3.5.

    Still open, and the cheapest to rule out: a measurement artefact. The trap
    beam overfills the back pupil to focus at full NA, so the cone leaving a 20x
    (NA 0.80) is far wider than one leaving a 4x (NA 0.20), and a detector of
    finite aperture and acceptance angle at the sample plane would under-read
    the high-NA lens. The widefield lines agree across objectives to within
    25 %, which is consistent with that -- their illumination does not fill the
    pupil the same way -- but consistency is not a test.
  ot_100pct: >-
    ANSWERED (KH, 2026-09-09): 100 % over-ranged the meter, which is why 80 % is
    the top row. Recorded on the row itself, with the linear extrapolation to
    1275 mW marked `assumed`.

    If a measured 100 % is ever wanted, extrapolation is not the route -- it
    needs a head with the range, or a 1064 attenuator of known transmission.
    The mirror will not serve as that attenuator: its 0.44 was measured at
    470/555/640 and using it at 1064 would trade one extrapolation for a worse
    one, across wavelength rather than along a line that has been shown linear.
  oil_objectives_visible: >-
    DECIDED (KH, 2026-09-09): the visible power through the 100x Oil will NOT be
    measured. It would need immersion oil against the meter window, and reading
    it dry gives a number without the coupling the lens is designed for. No plan
    to do it. The 60x Oil is in the same position and was not measured either.

    So `estimated_visible_mw` below is not a stopgap -- it is the standing
    answer for the objective this instrument actually images with (CLAUDE.md §1:
    100x Oil at 1x1 is the standing choice). Anything downstream that wants
    sample-plane power at 100x gets an estimate, permanently, and should say so.

# ---------------------------------------------------------------------------
# ESTIMATED visible power at 40x / 60x / 100x -- NOT MEASURED
# ---------------------------------------------------------------------------
# mW at 100 % level, from the MEASURED 20x times the vendor transmittance ratio
# at that line's wavelength. Two plots arrived labelled "20x"; KH judged them
# near-identical and directed that their AVERAGE be used, so these are single
# values rather than the range an earlier revision carried.
#
# HOW FAR THIS WAS TESTED. The same method was run backwards against the 4x,
# where a measurement exists: the curve predicts the measured 4x/20x ratio to
# within 5 % for the Aura and the LUN-F-XL, and MISSES BY 14-22 % for the
# Spectra -- systematically, across all three of its lines and both candidate
# plots. That is a property of the Spectra path or of how its rows were taken,
# not of the objectives, and it sets the uncertainty per source below.
#
# The transmittances were read off rendered plots by eye (+-2-3 %), which is
# adequate for a ratio and is not a source for a value -- see
# data/objectives.yaml on why `transmission` is still empty there.
#
# The headline is that magnification costs almost nothing in TOTAL power:
# every ratio to the 20x falls between 0.90 and 1.00. What magnification does
# cost is irradiance, through the area term, which is still unmeasured.
estimated_visible_mw:
  evidence: estimated
  basis: "measured 20x x vendor transmittance ratio, 2026-09-09"
  uncertainty: {Aura: "+-10 %", LUN-F-XL: "+-10 %", Spectra: "+-25 %"}
  at_100pct_level:
