# Illumination power at the sample plane -- MEASURED 2026-09-09.
#
# This closes the top blocker of docs/02 §1 and the deferral in SAFETY.md §1
# ("Dial % -> mW is uncalibrated, deferred 2026-08-19"). Raw readings only; the
# ratios in the notes were computed from these rows and should be recomputed
# rather than trusted, so that this file has one copy of each number.
#
# ---------------------------------------------------------------------------
# WHAT THIS UNBLOCKS, AND WHAT IT DOES NOT
# ---------------------------------------------------------------------------
#   UNBLOCKED at 20x: G20 (saturation / triplet) · G21 (light-driving) ·
#                     G22 (total dose). Irradiance now exists -- see below.
#   STILL BLOCKED:    G10 (photobleaching). It needs `bleach_photons`, which is
#                     per dye and empty for every dye. A power meter cannot
#                     supply it, and nothing here changes that.
#
# IRRADIANCE EXISTS, at 20x. `optics.path.excitation_rate_per_s` needs BOTH
# power and `illuminated_area_um2`, and as of 2026-09-09 it has both for all
# three engines: every one of them puts about the camera field on the sample,
# 603,654 um^2 at 20x. W/cm^2 at 100 % level:
#
#     Aura      7.62 / 7.70 / 2.63    CYAN  / GREEN / RED
#     Spectra   2.20 / 2.53 / 1.64    Cyan  / Green / Red
#     LUN-F-XL  1.14 / 1.08 / 1.64    488   / 561   / 640
#
# ⚠ AT 20x ONLY, and `computed` rather than measured. The area rests on the one
#   pixel size in data/pixel_size.yaml carrying `evidence: measured`, which is
#   the 20x row; every other objective's pixel size is `nominal`, so an area
#   built on it inherits that. And "about the camera field" was not quantified
#   for any of the three.

meta:
  date: 2026-09-09
  measured_by: "Kyu Hwan Choi and Saksham Malik"
  meter_model: "Thorlabs PM100A"
  head_type: photodiode
  head_model: S121C             # Thorlabs, silicon photodiode
  head_count: 1                 # ONE head for every line, visible and 1064
  head_wavelength_set: "changed per line, to that line's centre"
  head_aperture_mm: null        # not recorded
  head_position: null           # not recorded
  mm_config: null               # not recorded
  room_light: null              # not recorded
  purpose: >-
    Approximate values for gate arithmetic, stated as such by the operator
    (KH, 2026-09-09): "the purpose is a rough approximation, not an exact
    value." No uncertainty was propagated and none should be read in.

# ---------------------------------------------------------------------------
# PRE-CHECKS -- both were left unrecorded, and that is not the same as passing
# ---------------------------------------------------------------------------
checks:
  spot_fits_in_sensor:
    "4x": true                  # inferred 2026-09-09, see `inferred_from`
    "10x": true
    "20x": true
    evidence: inferred
    inferred_from: >-
      Not recorded at the bench, but the rows answer it themselves and the
      argument is short. The illuminated field scales as 1/M, so its AREA scales
      as 1/M^2. Had the beam overfilled the head, the head would have been
      reading a fixed area out of a beam 25x larger at 4x than at 20x, and
      P(4x)/P(20x) would be 0.04.

      It is not. Every source and every line reads between 1.01 and 1.24 --
      near unity, two orders from 0.04. So the beam fitted inside the head at
      all three objectives, for all three engines.

      TWO CONSEQUENCES. The mW figures are the WHOLE beam and not lower bounds,
      which reverses the caution this block previously carried. And for the
      Aura, irradiance is P over the CIRCLE's area, so the circle's diameter is
      needed after all -- the easy route, P over the sensor area, is closed.

      One row on the sheet still says "aperture full, size is different" for the
      LUN-F-XL at 640, which is unexplained and not contradicted by the above.
  zero_pct_vs_shutter_closed: null    # unrecorded; every 0 % row read 0 mW

# ---------------------------------------------------------------------------
# THE ROWS
# ---------------------------------------------------------------------------
# `sheet_line` is the label used at the bench. `registry_line` is the key in
# data/light_sources.yaml, which is what code reads -- they are NOT always the
# same and the difference is recorded rather than silently resolved.
#
# `path`: which elements were in the beam path.
#   all_in      mirror in,  multiband in,  IR in
#   mirror_out  mirror out, multiband in,  IR in
#   mband_out   mirror in,  multiband out, IR in
# The remaining combinations are not settable on this instrument
# (KH, 2026-09-09), so the planned all-elements-out cross-check was not taken.
#
# THE "MIRROR" IS `LappMainBranch1`, the Ti2's Lapp branch mirror, and it is a
# 50/50 -- stated by KH, 2026-09-09, not inferred here. The .cfg corroborates
# it by labelling the two states literally: State 1 is
# `mirror_in` and State 0 is `mirror_out`, and every config sets State 1 at
# Startup -- so `all_in` is the instrument's DEFAULT state and the mirror_out
# rows are the deliberate excursion, not the other way round.
#
# Its measured transmission is ~0.44 against a nominal 0.50 -- a real splitter
# with coating and surface losses -- and it is FLAT: 0.439/0.438/0.450 across
# 470/555/640, and the same to within 0.01 at all three objectives. One number
# is therefore enough and per-geometry values are NOT needed
# (KH, 2026-09-09), which is what the reduced measurement design assumed.
#
# mW at the sample plane, by level %. A `null` was below the meter's reading.
#
# ⚠ WHAT "%" MEANS DIFFERS BY ENGINE, and getting it wrong is a factor of ten.
# On the AURA the intensity control runs 0-1000, so the percentages below are
# percentages OF 1000 -- "5%" is `<NAME>_Intensity = 50` (KH, 2026-09-09), and
# typing 5 delivers 0.5%. CLAUDE.md §1's standing "GREEN ~80/1000" is 8% on
# this scale. The Spectra, LUN-F-XL and trap-laser rows are percentages of
# their own full scale.

units: mW at the sample plane

