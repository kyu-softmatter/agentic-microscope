# Illumination power at the sample plane -- MEASURED 2026-09-09.
#
# This closes the top blocker of docs/02 §1 and the deferral in SAFETY.md §1
# ("Dial % -> mW is uncalibrated, deferred 2026-08-19"). Raw readings only; the
# ratios in the notes were computed from these rows and should be recomputed
# rather than trusted, so that this file has one copy of each number.
#
# ---------------------------------------------------------------------------
# WHAT THIS UNBLOCKS, AND WHAT IT DOES NOT
# ---------------------------------------------------------------------------
#   UNBLOCKED:        G21 (light-driving) · G22 (total dose) -- once the
#                     illuminated area is measured, which it is not yet.
#   STILL BLOCKED:    G10 (photobleaching). It needs `bleach_photons`, which is
#                     per dye and empty for every dye. A power meter cannot
#                     supply it.
#
# ⚠ IRRADIANCE IS NOT AVAILABLE YET. `optics.path.excitation_rate_per_s` needs
#   BOTH power and `illuminated_area_um2`, and the area is unmeasured (below).
#   Everything here is total power at the sample plane, in mW.

meta:
  date: 2026-09-09
  measured_by: "Kyu Hwan Choi and Saksham Malik"
  meter_model: "Thorlabs PM100A"
  head_type: photodiode
  head_model: S121C             # Thorlabs, silicon photodiode
  head_count: 1                 # ONE head for every line, visible and 1064
  head_wavelength_set: "changed per line, to that line's centre"
  head_aperture_mm: null        # not recorded
  head_position: null           # not recorded
  mm_config: null               # not recorded
  room_light: null              # not recorded
  purpose: >-
    Approximate values for gate arithmetic, stated as such by the operator
    (KH, 2026-09-09): "the purpose is a rough approximation, not an exact
    value." No uncertainty was propagated and none should be read in.

# ---------------------------------------------------------------------------
# PRE-CHECKS -- both were left unrecorded, and that is not the same as passing
# ---------------------------------------------------------------------------
checks:
  spot_fits_in_sensor:
    "4x": null                  # unrecorded
    "10x": null
    "20x": null
    note: >-
      If the illuminated field overfilled the head at low magnification, those
      rows are lower bounds. Note the direction: 4x reads HIGHER than 20x here,
      so an overfill at 4x would mean the true 4x figure is higher still, not
      that the comparison is reversed. One row on the sheet says "aperture
      full, size is different" for the LUN-F-XL at 640.
  zero_pct_vs_shutter_closed: null    # unrecorded; every 0 % row read 0 mW

# ---------------------------------------------------------------------------
# THE ROWS
# ---------------------------------------------------------------------------
# `sheet_line` is the label used at the bench. `registry_line` is the key in
# data/light_sources.yaml, which is what code reads -- they are NOT always the
# same and the difference is recorded rather than silently resolved.
#
# `path`: which elements were in the beam path.
#   all_in      mirror in,  multiband in,  IR in
#   mirror_out  mirror out, multiband in,  IR in
#   mband_out   mirror in,  multiband out, IR in
# The remaining combinations are not settable on this instrument
# (KH, 2026-09-09), so the planned all-elements-out cross-check was not taken.
#
# mW at the sample plane, by level %. A `null` was below the meter's reading.
#
# ⚠ WHAT "%" MEANS DIFFERS BY ENGINE, and getting it wrong is a factor of ten.
# On the AURA the intensity control runs 0-1000, so the percentages below are
# percentages OF 1000 -- "5%" is `<NAME>_Intensity = 50` (KH, 2026-09-09), and
# typing 5 delivers 0.5%. CLAUDE.md §1's standing "GREEN ~80/1000" is 8% on
# this scale. The Spectra, LUN-F-XL and trap-laser rows are percentages of
# their own full scale.

units: mW at the sample plane

measurements:

  # ---- Aura ---------------------------------------------------------------
  - source: Aura
    sheet_line: 488
    registry_line: "488"
    path: all_in
    by_level_20x: {0: 0, 5: 3, 10: 5, 30: 14, 50: 23, 100: 46}
    at_100pct: {"4x": 47, "10x": 45, "20x": 46}

  - source: Aura
