    ruling: overruled
    basis: 'OVERRULED TO TIGHTEN, NOT TO CLEAR. An info/bias finding at m=10.0, not
      a hard finding at m<1, so §2 level 4 permits it, and the finding''s own action
      invites it -- ''this pass is only as good as that classification''. QUANTITY_REQUIREMENTS
      maps rheology to (''pixel_size'',) alone. For the modulus''s SCALE that is correct
      and I am not disturbing it: no photometric conversion enters G*, and I make
      no claim on flat_field or linearity. It is wrong for THIS proposal, because
      this rheology is read out of TRACKED POSITIONS: the short-lag MSD carries a
      static localisation-error offset, that offset sits in the same lags a complex
      modulus is fitted over, and its size is set by the photon budget. Neither arm
      has one. Two corroborations that this is not theoretical. (1) Lens 2''s Phase
      0 blocks on precisely those two fields, so the committee already treats them
      as load-bearing. (2) The analysis DISPOSES of the offset instead of measuring
      it: msd1d ends MSD = MSD - MSD(1), and analysis/matlab/README.md says in its
      own words that this ''also removes real signal at short lag -- do not copy it
      into anything that reports a diffusivity''. An offset subtracted rather than
      bounded is the definition of a bias nobody is carrying. PROPOSED REGISTRY EDIT
      for a human: rheology gains `background`, the shape tracking_intensity already
      has. I do not touch the table.'
