unevaluated_judgment:
- lens: 4
  name: sample
  state: judged
  agent: sample-optics
  status: BLOCKED
  rulings:
  - code: missing.imaging_depth
    ruling: upheld
    basis: 'The finding IS a refusal and the refusal stands. L4.2''s margin is free_WD/imaging_depth
      and L4.4 takes the same number as the wall distance h, so neither is defined
      without it; an imaging depth is a physical fact about the preparation, not a
      setting this lens may propose (rule 2, D2). The brief agrees from the other
      side: R1, consumed_by [L4.2, L4.4, L4.7]. One thing said more sharply than before:
      the block is SINGLE-VALUE but its cost is EIGHT checks, because Phase 0 is all-or-nothing,
      and at least three of the eight do not need the missing number at all.'
    source: sample/gate.py (_missing_inputs); sample/checks.py; config/briefs/active-microrheology.yaml
      > gaps[imaging_depth_um]
  - code: na_feasibility
    ruling: unevaluated
    basis: 'No finding exists, so there is nothing to uphold. This is the silence
      that costs least and is cheapest to end: both inputs are on record and both
      are measured -- the objective''s NA and immersion from data/objectives.yaml
      (verified_na: true, cross-checked against the barrel engravings) and IMMERSION_N.
      The check needs NO imaging depth. The cost of the silence is specific: L4.1
      is the ONLY place an NA-vs-immersion inconsistency is caught, because Objective.collection_efficiency
      clamps the impossible case with min(na/n, 1.0) and returns a plausible number
      regardless. Lens 1 DID run on this packet and published geometric_collection
      0.3263 through that clamp -- so lens 1''s collection figure currently rests
      on a consistency nothing in this committee checked.'
    source: sample/checks.py::check_na_feasibility; data/objectives.yaml; optics/components.py
      (IMMERSION_N, Objective.collection_efficiency)
  - code: working_distance
    ruling: unevaluated
    basis: 'Genuinely unanswerable -- the imaging depth is its whole denominator.
      Its NUMERATOR is established, and two previously-unattached items now live here.
      (1) The correction collar: assumed_inputs says collar_adjusted is False on the
      40x WI, the only objective on the nosepiece with a collar. Since G18 was retired
      2026-09-10 the collar condition lives in exactly this check''s budget and in
      assumed_inputs -- so there is no separate coverslip subject, and an unrecorded
      collar now rides here INVISIBLY rather than capping a margin. Ask it ALONGSIDE
      the depth or this lens blocks twice. (2) The coverslip: 170 um against a 170
      um design, so the geometry is sound and the READING is what is missing -- a
      thirty-second micrometer measurement. Note the objective is registered at the
      CONSERVATIVE end of its collar-dependent WD span; that is deliberate and should
      not be corrected upward.'
    source: sample/checks.py::check_working_distance; data/objectives.yaml; kb/expertise/coverslip-thickness-in-use.md;
      kb/decisions/2026-09-10-lens-4-depth-window-and-g18-removed.md
  - code: depth_in_chamber
    ruling: unevaluated
    basis: 'Unanswerable, and missing BOTH inputs -- the depth and chamber_height_um
      (R1, consumed_by [L4.3, L8.2]). Two non-interchangeable points. First, its ordinary
      failure mode is easy to misdiagnose: focusing past the far wall gives an EMPTY
      focal plane, which looks exactly like a DIM one, so an operator who hits it
      reaches for the light level and lands in lens 5''s dose budget for no reason.
      Second, this lab''s mount is UNSPACED by default, so there is no designed thickness
      to look up: the gap is set by drop volume, wetting and the coverslip''s weight,
      and a squashed drop is a WEDGE. Not cosmetic here -- the probe is steered across
      the field, so its depth changes as it moves, which is precisely when a height-specific
      trap calibration stops holding. Ask once and hand the answer to lens 8 too.'
    source: sample/checks.py::check_depth_in_chamber; kb/expertise/sample-mount-geometry.md;
      config/briefs/active-microrheology.yaml > gaps[chamber_height_um]
  - code: wall_drag
    ruling: unevaluated
    basis: 'Unanswerable as posed, and beyond the missing depth: the check evaluates
      ONE scalar radius per run and this proposal has two populations. a=2.5 um trapped
      lands on geometry.wall_drag.trapped (lens 6''s CORRECTIONS); a=0.25 um untrapped
      lands on geometry.wall_drag (UNCORRECTABLE). Same physics, opposite dispositions.
      The intended quantity is rheology FROM THE FREE TRACERS, so the UNCORRECTABLE
      branch is live, nothing absorbs it, and it is lens 6''s to rule on. Carried
      forward and still live: the trapped branch''s absorption premise is NOT satisfied
      -- it holds where gamma comes OUT of a fit and is FALSE where gamma goes IN
      as 6*pi*eta*a. This brief reads F = kappa*(x_bead - x_trap) and its gap trap_stiffness_for_this_config
      (R2) says no kappa is established at 40x WI. Direction, which the silence does
      not remove: gamma up -> D down -> viscosity and moduli read STIFF. A direction,
      not a size.'
    source: sample/checks.py::check_wall_drag; docs/06-pitfalls.md D8; kb/decisions/2026-09-11-wall-drag-reaches-the-bias-ledger.md
  - code: ri_mismatch
    ruling: unevaluated
    basis: 'I cannot rule on a result that does not exist -- but this is the silence
      I most object to. Since 2026-09-10 this check is INFO and gates nothing; it
      is the mechanical-z to optical-depth CONVERTER, and its matched branch returns
      before imaging_depth_um is used for anything but a reported field. Both indices
      are on record -- water immersion into an ordinary aqueous medium (DEFAULT_N_SAMPLE,
      settled 2026-08-19) -- so the check was FULLY ANSWERABLE TODAY and Phase 0 suppressed
      it for a number it does not need. What was lost is not a warning but the one
      POSITIVE statement supporting the proposal: water into water is index-matched,
      so mechanical z travel IS optical depth, no axial scale error and no depth-dependent
      mismatch aberration. That is the substance of the documented departure from
      the standing 100x Oil, and the departure is correct on this lens''s grounds.
      Against it, the oil objective offers somewhat more GEOMETRIC collection -- but
      lens 1''s deficit on this packet is SPECTRAL (21% and 13%) and its own filter
      suggestions recover 1.69x and 2.47x. Do not spend the index match to buy back
      a few percent of geometry; fix the emission filters.'
    source: sample/checks.py::check_ri_mismatch; optics/components.py; kb/expertise/sample-medium-refractive-index.md;
      kb/decisions/2026-08-19-lens-4-scope.md
  - code: count_in_field
    ruling: unevaluated
    basis: 'Unanswerable, and the depth is the least of what is missing: it needs
      a tracer concentration (R1), the chamber height, and the field width and height
      -- lens 2''s ROI times lens 2''s pixel, which do not exist because lens 2''s
      own ROI gaps are open. Three lenses'' gaps meet in this one silence. Two additions
      no version of this check would have said. (1) MULTIPLE SCATTERING has no model
      anywhere here, so ''too concentrated'' means distorted signal and not merely
      mislinking; direction only, indefinitely. (2) The SIGN of any count reasoning
      is not mine: this check''s premise is total sedimentation onto the coverslip,
      and with the focal plane near the floor of a thin unspaced preparation settling
      brings particles INTO the observed volume rather than depleting it. Only lens
      8 can determine it, and lens 8 did not run. The old 4 -> 6 half is GONE, so
      whether there are ENOUGH tracers is not inherited by anyone -- said here so
      this silence is read as clearing neither crowding nor sufficiency.'
    source: sample/checks.py::check_count_in_field; docs/01-architecture.md §4 (4
      <-> 8)
  - code: depth_window
    ruling: unevaluated
    basis: 'Still cannot rule -- but this is the check I singled out last time and
      the objection survives in sharper form. check_depth_window NEVER reads imaging_depth_um:
      its ceiling comes from the free working distance and the chamber height, its
      floor from the particle radius via L4.4. So it is the check that ANSWERS the
      question the block asks -- which depths are allowed -- and Phase 0 suppressed
      the answer to demand one depth as input. That is D6 exactly. Its ceiling is
      available today; its floor is not, for the same reason L4.4 is stuck, and the
      floor scales linearly with radius so the two populations have different windows.
      The specific risk it exists to catch is the EMPTY window, which no single margin
      can express: for a 2.5 um-radius probe the wall-drag floor may exceed an unspaced
      drop''s thickness outright, in which case no depth satisfies both ends while
      each end is individually satisfiable. ACTIONABLE REQUEST in place of a ruling:
      re-run this lens twice, once per population, with the radius set explicitly
      and a chamber height supplied, and the window comes back without anyone having
      guessed a depth.'
    source: sample/checks.py::check_depth_window; kb/decisions/2026-09-10-lens-4-depth-window-and-g18-removed.md;
      CLAUDE.md §2b D6
  - code: count_sufficiency
    ruling: unevaluated
    basis: 'Unanswerable -- it shares L4.6''s inputs exactly and is equally silent
      by construction, so the two halves cannot disagree about how many particles
      there are. Its distinct content, which must not be lost in the pile of eight:
      this is the LOWER bound, the only thing in the repository catching a sample
      too dilute to measure, and the only such check since G11''s removal. For a two-population
      microrheology run the dilute direction is the realistic one. One thing I flag
      as the BRIEF''s to fix, not the gate''s: target_particles_in_field defaults
      to 1.0, which originates nothing -- below one particle there is no measurement
      -- but this is an ENSEMBLE tracer measurement and an ensemble raises that threshold
      in the brief. The brief does not set it. So even once the concentration arrives
      this check would grade against a definitional floor rather than this experiment''s
      requirement, and its pass would mean less than it looks like. Ask for the target
      alongside the concentration.'
    source: sample/checks.py::check_count_sufficiency; config/briefs/active-microrheology.yaml
      > goal.intended_quantity, gaps
  unevaluated:
  - code: null
    source: config/briefs/active-microrheology.yaml > facts.lens_9_velocity, gaps[velocity_time_base];
      kb/decisions/2026-09-11-the-velocity-lens.md
    why: LENS 9 IS ABSENT FROM cross_lens AND THIS IS STILL LIVE -- named before and
      not added. Lens 9 owns commanded-motion scale and it reaches this lens twice.
      (a) The probe's 0-30 um/s steering across the field is what makes an unspaced
      WEDGE a depth-VARYING quantity rather than a static one, which is the L4.3/L4.7
      concern. (b) If kappa is recovered as gamma*v/x_eq, lens 9's unverified TIME
      base multiplies straight into the drag L4.4 bounds -- velocity_time_base is
      R2 and L9.1 fails on every real configuration. Neither coupling appears in any
      cross-lens row, so nothing carries it and I am carrying it by hand.
  - code: null
    source: CLAUDE.md §3 E4; config/briefs/active-microrheology.yaml > gaps[acquisition_duration_s]
    why: 'LENS 8 DID NOT RUN, and per E4 that is a HOLE -- its row belongs in lens
      6''s bias ledger as unevaluated. Recorded as a standing procedural item because
      what is missing is a convened lens and not a margin: why_absent is ''no acquisition
      duration'', which makes lens 8''s absence a consequence of an R1 gap and reversible
      by one answer. Until it is convened, the settling sign in count_in_field, the
      evaporation of a thin unspaced drop, and room temperature are all unowned.'
  - code: null
    source: sample/checks.py (no such check); docs/06-pitfalls.md
    why: MULTIPLE SCATTERING has no model here and no check emits for it, so it cannot
      attach to any of the nine. Stated separately so it survives if count_in_field's
      row is read as being only about a missing concentration. Direction only, indefinitely.
  - code: null
    source: kb/decisions/2026-08-19-lens-4-scope.md §3
    why: 'NO WAVE-OPTICS ABERRATION MODEL exists and I am NOT raising it as a gap
      -- a closed scope decision, recorded so its absence is visible rather than silent.
      It costs this proposal nothing in any case: the configuration is index-matched,
      so the depth-dependent mismatch aberration a model would quantify is zero here.'
  - code: null
    source: kb/decisions/2026-09-10-lens-4-depth-window-and-g18-removed.md
    why: 'NO COVERSLIP OR COLLAR SUBJECT EXISTS among the nine, because G18 was retired
      2026-09-10 and its condition folded into L4.2''s budget. That is the right design,
      with a consequence worth stating: an unadjusted correction collar on the 40x
      WI -- the only objective with one -- now rides invisibly inside working_distance
      and assumed_inputs, where it used to cap a margin of its own. I attached it
      to working_distance, but nothing in the packet''s structure would have made
      me. If a future revision wants the collar rulable, it needs a subject.'
- lens: 5
  name: photo
  state: judged
  agent: photo-perturbation
  status: BLOCKED
  rulings:
  - code: missing.power_at_sample
    ruling: upheld
    basis: 'The finding stands as reported, and it is a refusal I am upholding rather
      than a defect I am waiving. This proposal is at 40x WI and there is no illuminated
      area at 40x anywhere: illuminated_area_um2 carries a 20x key for all three engines
      (LUN-F-XL 603654, Spectra 603654, Aura 948218), nulls 4x and 10x because an
      area built from a nominal pixel size inherits that tier, and has NO 40x key.
      With no area there is no W/cm2, and photo/gate.py::_missing_inputs emits this
      code exactly when resolved_irradiance is None. The power half is marginally
      better: Spectra Cyan 13.2 mW, Red 9.3 mW at 100%, tier estimated, +-25%, read
      off rendered vendor plots by eye. Lens 1 agrees from the other side -- both
      LightEngine power-at-sample entries sit in its assumed_inputs. The only two
      routes to `overruled` are the percent setting, which is not a physical quantity,
      or scaling 603,654 um2 by 1/M^2 myself, which would be originating a physical
      number (rule 2). R2 instructs BLOCK, not default.'
    source: kb/calibrations/illumination-power.yaml; config/briefs/active-microrheology.yaml
      gaps.illuminated_area_um2__at_40x; photo/gate.py::_missing_inputs
  - code: missing.exposure_plan
    ruling: upheld
    basis: 'The finding stands and it is not mine to resolve. Exposure and frame count
      are lens 2''s settings (01 §4); this section only multiplies them into a dose.
      All three components are R1: exposure_ms (the channel file''s header reasons
      at 1.5 ms but the body does not carry it, so it is an intent not a decision),
      target_fps, acquisition_duration_s. Adopting the header''s 1.5 ms would feed
      a SETTING I proposed into my own gate -- D2 and D7 both forbid it. The departure
      is not free: the standing condition is 20.0 ms => ~50 fps, and every script
      in analysis/matlab/ hardcodes frame_time = 0.02, so the number that unblocks
      my dose report also obliges an analysis change, which is lens 6''s to own.'
    source: config/briefs/active-microrheology.yaml gaps + departures; kb/expertise/microrheology-standard-conditions.md;
      docs/01-architecture.md §4
  - code: light_driving
    ruling: upheld
    basis: 'THE SILENCE IS ACCEPTABLE AND EXPENSIVE, and upholding it is not clearing
      it. Acceptable because it is ENTAILED by the first refusal and not independent
      of it: L5.1 is registered Check(''light_driving'', INFO, (''irradiance'',),
      ...) and missing.power_at_sample fires on exactly the condition that irradiance
      is absent -- had the gate reached Phase 1, check_light_driving would have raised
      on the f-string in its own photoresponsive-is-None branch. There is no report
      being withheld, only one that does not exist. What it COSTS is the whole reason
      this section exists, and three things are absent in different ways. (1) Irradiance
      at 40x -- ruled above. (2) The threshold: R3, nobody-knows, no entry carries
      one. (3) The ANSWER to ''does this sample respond to this light at all'', never
      asked -- photoresponsive is None and appears verbatim in assumed_inputs as ''never
      asked, so light-driving is unconfirmed rather than cleared''. kb/samples/ does
      not exist, so there was nowhere to look it up. A 5 um PS probe and 0.5 um PS
      tracers are not obviously photoresponsive, but ''not obviously'' is not an answer
      and I will not convert it into one; docs/06 D2''s accident is precisely the
      unasked question. ASK KH: do either bead population, or the suspending medium,
      respond to 488 nm or 640 nm at the levels this run will use?'
    source: photo/checks.py::CHECKS and check_light_driving; docs/06-pitfalls.md D2
  - code: total_dose
    ruling: upheld
    basis: 'The silence is faithful in content and lossy in form. check_total_dose
      is registered with an EMPTY requires tuple, so nothing stopped it on its own
      inputs; but its first branch returns evaluated=False when irradiance, exposure
      or n_frames is None, and all three are None here. So the report it would have
      produced is the same statement the two refusals already make, which is why I
      uphold rather than overrule. What is lost is the explicit evaluated: False stamp,
      and that matters because MAX_MARGIN 10.0 is what the check returns in that branch:
      a reader seeing the margin without the stamp would read HEADROOM where there
      is no evaluation (rule 3). One cost is NOT covered by either refusal: frame_interval_ms
      is also absent and sits in assumed_inputs as ''duty cycle not computed''. Even
      after a measured 40x irradiance and an exposure plan arrive, the duty cycle
      -- the part deciding whether the dose lands as a burst or over an hour -- would
      still be missing. No dose number exists in either direction and none should
      be quoted from this section.'
    source: photo/checks.py::check_total_dose and CHECKS; packet verdict.assumed_inputs[frame
      interval]
  - code: trap_heating
    ruling: overruled
    basis: 'THE SILENCE DOES NOT HOLD FOR THIS PROPOSAL, and I am overruling the SKIP
      rather than a report -- overruling here TIGHTENS, it does not proceed past anything
      (this subject is info, not a hard finding at m < 1, so §2 level 4 permits it).
      The skip is an artifact of the seam, not of a missing input: Check(''trap_heating'',
      INFO, (), ...) requires NOTHING, and check_trap_heating_ownership branches on
      setup.trap_on alone -- a field with no dependence on power, area, exposure or
      frame count. It was silenced only because photo/gate.py::evaluate returns at
      Phase 0 before results = [c.run(setup) for c in CHECKS]. So a check whose entire
      purpose is to stop an unowned risk vanishing was suppressed by an unrelated
      missing number, on a proposal where its trigger is LIVE: a 1064 nm Aresis Tweez
      300 holding the 5 um probe. CARRIED BY HAND so the handoff does not disappear
