# System profile — CSU-W1 spinning-disk confocal (LUN-F-XL laser combiner) path.
#
# The lasers / optical_path_nis sections of kb/systems/current.md, transposed
# into the minimal form optics.recommend can consume. The only light source
# that can be called a "laser" is LUN-F-XL (LightEngine/Aura are LEDs — see
# kb/systems/current.md).
#
# Everything written here is "what is physically in this slot, actually".
# Whether that is acceptable (= validation) is computed by optics/checks.py,
# which combination is better (= recommendation) by optics/recommend.py. This
# file itself holds no logic (see docs/08 §6).

scope:
  name: current-laser
  path: "CSU-W1 spinning-disk confocal, LUN-F-XL laser excitation"
  source_of_truth: kb/systems/current.md
  verified_date: 2026-08-10

  source:
    device: LUN-F-XL # data/light_sources.yaml#LUN-F-XL
    lines: ["405", "488", "561", "640"]

  # No excitation-side shaping filter — the laser lines are already ~1-2nm
  # wide, and the dichroic notch doubles as excitation cleanup
  # (kb/systems/current.md > lasers note).
  excitation: []

  dichroic: "Di01-T405/488/568/647-13x15x0.5" # data/filters.yaml, fixed, not removable

  # EM1/EM2 emission filter wheels — one per camera arm, independently
  # confirmed to have identical configurations (kb/systems/current.md >
  # optical_path_nis > EM1/EM2, 2026-08-11). The camera assignment is settled
  # too, EM1=Kinetix_red and EM2=Kinetix_blue, but since the configurations are
  # the same it makes no difference to the calculation — both cameras pick from
  # this list.
  #
  # 2026-08-11 correction: the actual filters in positions 0-4 are
  # multi/405/488/555/647 (matching the CSUW1-Filter_Red Label in
  # DMD_dualcam.cfg), but with no fwhm or actual-passband data they cannot yet
  # be registered in data/filters.yaml (no guessing) — excluded from the
  # candidates until they are. The 5 that used to sit here ("88000v2-EM",
  # "EM1-455/50", etc.) were not EM1/EM2's actual filters (corrected as a
  # misattribution — see the comment on those entries in data/filters.yaml)
  # — removed.
  emission_filters:
    # position 5-8: Blocked (blocked by a metal plate, not selectable) —
    # excluded from the candidates.
    - "EM-Open" # position 9 — no filter (open), all wavelengths pass. Confirmed 2026-08-11.

  # Dual-camera image splitter (kb/systems/current.md > optical_path_nis >
  # Splitter, user confirmed 2026-08-10: position 1 "DM A561LP" active, both
  # cameras in simultaneous use). Splits the emission at 561nm and sends each
  # part to one camera — Kinetix_red=transmit side (>561, longer wavelengths),
  # Kinetix_blue=reflect side (<561, shorter wavelengths).
  # optics.recommend computes every (dye,line,filter) candidate for both
  # cameras and reports the side where more signal actually lands as that
  # candidate's camera.
  splitter:
    registry: "DM A561LP"
    cameras:
      Kinetix_red: transmit
      Kinetix_blue: reflect

  # ⚠ The actual cameras are Kinetix (x2), but they are not in
  # data/detectors.yaml yet. The name stays "Kinetix" — substituting Prime95B
  # would amount to quietly borrowing a different QE curve, so we do not
  # (same principle as optics/gate.py). Until it is registered, QE is computed
  # with a flat 0.8 placeholder and evidence is recorded as assumed. Add the
  # Kinetix datasheet QE curve to data/detectors.yaml.
  detector: Kinetix

  # NA unconfirmed (kb/systems/current.md > objectives, all verified: false).
  # The four checks optics.recommend uses (excitation/stokes/blocking/collection)
  # do not use NA, so this screening stage is unaffected — but this result does
  # not stand in for the final verdict of `optics.cli check`. Before running an
  # experiment, always fill in the objective NA and re-check with
  # `optics.cli check`.
  objective: null
