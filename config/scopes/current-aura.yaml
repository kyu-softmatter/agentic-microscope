# System profile — widefield LED-epi illumination (Lumencor AuraIII / MM
# device name Aura), through the MXR00724 5-band cube to the CSU-W1 unit.
#
# Structurally identical to config/scopes/current-spectra.yaml, only the light
# source differs — Aura does not pass through the DMD (SpectraIII only, see
# kb/systems/current.md). That difference has no spectral effect either (a
# patterned illuminator with no wavelength-selection function), so it does not
# show up in this screening anyway.

scope:
  name: current-aura
  path: "Widefield LED-epi (AuraIII / Aura) through MXR00724 cube"
  source_of_truth: kb/systems/current.md
  verified_date: 2026-08-10

  source:
    device: Aura # data/light_sources.yaml#Aura (registry: AuraIII)
    lines: ["405", "440", "488", "561", "640"]

  excitation: ["MXR00724-EX"]
  dichroic: "MXR00724-DM"
  emission_fixed: ["MXR00724-EM"]

  emission_filters:
    - "88000v2-EM"
    - "EM1-455/50"
    - "EM1-525/36"
    - "EM1-605/52"
    - "EM1-705/72"

  splitter:
    registry: "DM A561LP"
    cameras:
      Kinetix_red: transmit
      Kinetix_blue: reflect

  detector: Kinetix

  # Experiment-level choice, so null here. Name one from the nosepiece below.
  objective: null

  # 6-position nosepiece. ONE physical turret, shared by every light path on
  # this stand, so the specs live in data/objectives.yaml and are referenced
  # here rather than copied. Lens 4 (sample/) consumes these:
  # `python -m sample.cli check --objective 40x-WI`.
  nosepiece:                     # data/objectives.yaml
    - {position: 0, ref: 4x}
    - {position: 1, ref: 10x}
    - {position: 2, ref: 20x}
    - {position: 3, ref: 40x-WI}      # index-matched for water-based media
    - {position: 4, ref: 60x-Oil}
    - {position: 5, ref: 100x-Oil}
