# System profile — widefield LED-epi illumination (Lumencor SpectraIII / MM
# device name LightEngine), through the MXR00724 5-band cube to the CSU-W1
# unit (internal dichroic fixed "on" + splitter + EM1/EM2).
#
# Source: kb/systems/current.md > light_paths > widefield-spectra3 (obtained
# 2026-08-10 by user dictation). Exactly one thing differs from
# config/scopes/current-laser.yaml — the light source, and the fixed cube it
# passes through (MXR00724 excitation/dichroic/emission). Everything after
# that (splitter~EM1/EM2~cameras) is the same hardware every light source
# shares.
#
# Note: the DMD (pattern illumination, no wavelength selection) and
# LappMainBranch1 (branch mirror, changes only the light-level split with no
# spectral effect) are not covered here — neither has any part in "which
# wavelengths pass", so there is no reason to put them in this screening
# (see the relevant notes in kb/systems/current.md).

scope:
  name: current-spectra
  path: "Widefield LED-epi (SpectraIII / LightEngine) through MXR00724 cube"
  source_of_truth: kb/systems/current.md
  verified_date: 2026-08-10

  source:
    device: LightEngine # data/light_sources.yaml#LightEngine (registry: SpectraIII)
    # Read off the diagram, no fwhm or measured power — see kb/systems/current.md.
    # How many of these actually pass through MXR00724-EX is what the
    # screening calculation tells you.
    lines: ["365", "440", "488", "514", "561", "594", "640"]

  # MXR00724 cube — the only cube currently installed in FilterTurret1, so it
  # is treated as fixed. (Corrected 2026-08-10 to note that it is individually
  # replaceable, but "what is plugged in right now" is only this one.)
  excitation: ["MXR00724-EX"]
  dichroic: "MXR00724-DM"
  emission_fixed: ["MXR00724-EM"] # the cube's own 5-band emission filter, always in the path

  # Everything below is identical to config/scopes/current-laser.yaml — shared
  # hardware from the CSU-W1 splitter onward. See the comments in
  # current-laser.yaml.
  # ⚠ CORRECTED 2026-09-06. This list read
  #     88000v2-EM / EM1-455/50 / EM1-525/36 / EM1-605/52 / EM1-705/72
  # which is the set config/scopes/current-laser.yaml RETRACTED on 2026-08-11
  # as a misattribution -- another element's data had been attached to these
  # wheels. The retraction reached that one profile and neither of the other
  # two, so one physical pair of wheels had two contradictory records for
  # nearly a month (kb/systems/dualcam-config-corrections-pending.md item 2b,
  # which named current-aura.yaml only -- current-spectra.yaml carried it too).
  #
  # EM1/EM2 are the SAME physical wheels whichever source is illuminating, so
  # all three profiles must carry one list. This is now current-laser.yaml's,
  # verbatim; see its block comment for the position<->part reasoning and for
  # why position 0 ("multi") is registered but deliberately not a candidate.
  #
  # ⚠ STILL OPEN, and it is not this edit's to close: no wheel part number
  # exists behind ANY of these. The parts are INFERRED from each position's
  # label being an EXCITATION line, then operator-confirmed -- not read off
  # the hardware. README to-do item 3 holds the measurement that would settle
  # it (centre and FWHM for positions 1-4).
  emission_filters:
    - "FF01-432/36" # position 1, label "405"  — 414.0-450.0 nm, reflects → Kinetix_blue
    - "FF01-515/30" # position 2, label "488"  — 500.0-530.0 nm, reflects → Kinetix_blue
    - "FF01-595/31" # position 3, label "555"  — 579.5-610.5 nm, transmits → Kinetix_red
    - "FF01-680/42" # position 4, label "647"  — 659.0-701.0 nm, transmits → Kinetix_red
    # position 5-8: Blocked (blocked by a metal plate, not selectable) —
    # excluded from the candidates.
    - "EM-Open" # position 9 — no filter (open), all wavelengths pass. Confirmed 2026-08-11.

  splitter:
    registry: "DM A561LP"
    cameras:
      Kinetix_red: transmit
      Kinetix_blue: reflect

  detector: Kinetix

  # Experiment-level choice, so null here. Name one from the nosepiece below.
  objective: null

  # 6-position nosepiece. ONE physical turret, shared by every light path on
  # this stand, so the specs live in data/objectives.yaml and are referenced
  # here rather than copied. Lens 4 (sample/) consumes these:
  # `python -m sample.cli check --objective 60x-Oil`.
  nosepiece:                     # data/objectives.yaml
    - {position: 0, ref: 4x}
    - {position: 1, ref: 10x}
    - {position: 2, ref: 20x}
    - {position: 3, ref: 40x-WI}      # index-matched for water-based media
    - {position: 4, ref: 60x-Oil}
    - {position: 5, ref: 100x-Oil}
