# System profile — widefield LED-epi illumination (Lumencor SpectraIII / MM
# device name LightEngine), through the MXR00724 5-band cube to the CSU-W1
# unit (internal dichroic fixed "on" + splitter + EM1/EM2).
#
# Source: kb/systems/current.md > light_paths > widefield-spectra3 (obtained
# 2026-08-10 by user dictation). Exactly one thing differs from
# config/scopes/current-laser.yaml — the light source, and the fixed cube it
# passes through (MXR00724 excitation/dichroic/emission). Everything after
# that (splitter~EM1/EM2~cameras) is the same hardware every light source
# shares.
#
# Note: the DMD (pattern illumination, no wavelength selection) and
# LappMainBranch1 (branch mirror, changes only the light-level split with no
# spectral effect) are not covered here — neither has any part in "which
# wavelengths pass", so there is no reason to put them in this screening
# (see the relevant notes in kb/systems/current.md).

scope:
  name: current-spectra
  path: "Widefield LED-epi (SpectraIII / LightEngine) through MXR00724 cube"
  source_of_truth: kb/systems/current.md
  verified_date: 2026-08-10

  source:
    device: LightEngine # data/light_sources.yaml#LightEngine (registry: SpectraIII)
    # Read off the diagram, no fwhm or measured power — see kb/systems/current.md.
    # How many of these actually pass through MXR00724-EX is what the
    # screening calculation tells you.
    lines: ["365", "440", "488", "514", "561", "594", "640"]

  # MXR00724 cube — the only cube currently installed in FilterTurret1, so it
  # is treated as fixed. (Corrected 2026-08-10 to note that it is individually
  # replaceable, but "what is plugged in right now" is only this one.)
  excitation: ["MXR00724-EX"]
  dichroic: "MXR00724-DM"
  emission_fixed: ["MXR00724-EM"] # the cube's own 5-band emission filter, always in the path

  # Everything below is identical to config/scopes/current-laser.yaml — shared
  # hardware from the CSU-W1 splitter onward. See the comments in
  # current-laser.yaml.
  emission_filters:
    - "88000v2-EM"
    - "EM1-455/50"
    - "EM1-525/36"
    - "EM1-605/52"
    - "EM1-705/72"

  splitter:
    registry: "DM A561LP"
    cameras:
      Kinetix_red: transmit
      Kinetix_blue: reflect

  detector: Kinetix
  objective: null
