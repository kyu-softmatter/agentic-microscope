# PixelSize settings

# Added 2026-09-04. This block was present and empty, so getPixelSizeUm()
# answered 0.0 and anything asking the instrument for its scale got nothing.
# Values mirror data/pixel_size.yaml <- kb/systems/current.md
# <- "Confocal_microscope_conversion_factor(Apr 2025).xlsx". Kinetix, binning 1.
#
# THESE PRESETS ASSUME THE INTERMEDIATE MAGNIFICATION IS 1x.
# They key on the Nosepiece alone, because IntermediateMagnification's turret
# positions are named nowhere in this file -- the Nosepiece has six Label lines
# above and that device has none. So MM will report these numbers whatever the
# changer is set to, and at 1.5x every one of them is high by exactly 1.5x.
#
# To close that, at the microscope:
#     python -m calibration.cli intermediate-mag <this file>
# It prints the Label lines for the turret and a full two-property preset per
# objective x factor. Once a preset names both devices, MM matches only when
# both agree and reports 0.0 at an unlisted combination -- absent rather than
# wrong, which is the behaviour to want back.
#
# Only 20x is a measurement. The other five are exactly 6.5/M to every digit
# they carry, i.e. the same arithmetic MM would do itself; 20x is 0.32373
# against a nominal 0.325, a real 20.078x. See data/pixel_size.yaml.
ConfigPixelSize,4x-1x,Nosepiece,Label,1-Plan Apo LmbdD20 4x
