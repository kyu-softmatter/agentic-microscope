# Focus directions
# ======================================================================
# ZDrive: 1 = INCREASING Z MOVES TOWARD THE SAMPLE.
#
# Equivalently, smaller Z is the retracted direction -- measured by the
# operator 2026-09-05 and carried in code as
# `hardware.microscope.Z_RETRACT_DIRECTION = -1`. It stood here as 0
# ("unknown") until 2026-09-06 while the measurement sat in SAFETY.md
# prose and one Python constant, so MM itself could not answer which way
# retract was.
#
# ⚠ THIS IS A SAFETY-RELEVANT SIGN, AND IT REVERSED ONCE. Until
# 2026-09-05 this repository carried the opposite guess ("+Z is probably
# retracted"), inferred from a nosepiece rotation at ZDrive = 8288.740
# that broke nothing -- which under the measured convention had driven
# the incoming lens ~5.3 mm PAST the sample plane, so nothing broke
# because nothing was in the way. Anyone following the old guess would
# have driven the objective toward a coverslip 0.13 mm away believing
# they were retracting. SAFETY.md section 2 is the full account.
#
# WHY `1` AND NOT `-1` OR `2`: those are the two plausible encodings of
# this field and `1` means "toward sample" in BOTH of them -- as a sign
# (anything > 0 is toward the sample) and as the MM enum ordinal
# (0 Unknown, 1 TowardSample, 2 AwayFromSample). So this line does not
# rest on knowing which one MMCore parses. Do not "correct" it to 2 or
# -1 without first confirming the encoding against a live core; either
# would be a coin flip on a direction that swings glass at a coverslip.
#
# PFSOffset stays 0 = UNKNOWN, deliberately. Its sign convention has
# never been measured or stated -- nothing in this repository records
# which way its offset lens moves relative to the sample -- and it is in
# COLLISION_DEVICES alongside ZDrive and the Nosepiece. An unmeasured
# direction written here would read as verified.
# TODO(human): the PFSOffset sign, measured the way the ZDrive one was.
# ======================================================================
FocusDirection,ZDrive,1
FocusDirection,PFSOffset,0

