# WHY A DUAL-CAM noDMD VARIANT EXISTS (added 2026-09-06)
# -----------------------------------------------------
# This is the configuration for the two-colour simultaneous run: Kinetix_blue
# (Camera-1, reflect side of the splitter, Dragon Green) AND Kinetix_red
# (Camera-2, transmit side, the Abvigen red bead) loaded together. The three
# single-camera variants deliberately load one body each so the Tweez GUI can
# hold the other (SAFETY.md §4), which is the right choice for setup work and
# the wrong one here -- a two-colour measurement needs both bodies in ONE
# process, because PVCAM hands a Kinetix to one owner at a time.
#
# ⚠ CONSEQUENCE: WITH THIS CONFIG LOADED THE TWEEZ GUI CANNOT HAVE A CAMERA.
# Do the GUI-side work first -- trap placement, the px->um calibration that an
# objective change invalidates (SAFETY.md §2) -- then release, then load this.
#
# ⚠ THERE IS NO "Multi Camera" UTILITY DEVICE HERE. Core.Camera names one body
# (Kinetix_red below), so `snapImage` and `startSequenceAcquisition` address
# that one only. Driving both is a per-camera call on each label; simultaneity
# comes from the hardware trigger, not from MMCore doing it for you.
# Generated by Configurator on Fri Jul 03 15:32:35 PDT 2026

