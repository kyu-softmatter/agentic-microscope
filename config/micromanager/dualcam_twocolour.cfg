# ======================================================================
# WHY THESE ARE PINNED BY `State` AND NOT BY `Label`.
#
# The photometry is settled and is independent of every name below:
# LappMainBranch1 State 1 passes the Lapp-branch light to the sample
# (p99.9 21083 ADU), State 0 blocks it completely (139, identical to a
# dark frame). Measured 2026-09-04, re-confirmed independently
# 2026-09-06 through a different filter at a different exposure.
#
# The NAMES for those two states were swapped in this file until
# 2026-09-06 and are now `1 = mirror_in`, `0 = mirror_out` per the
# operator (2026-09-05) -- a mirror *inserted* is what couples the side
# branch in, which is also the physically sensible reading. Because that
# attribution moved once, a preset written as `...,Label,mirror_out`
# would have silently selected the BLOCKING state the day it moved.
# Pinning the integer makes this line survive any further renaming.
#   kb/systems/dualcam-config-corrections-pending.md item 1
#   kb/systems/current.md > lapp_branch
# ======================================================================
ConfigGroup,System,Startup,LappMainBranch1,State,1
