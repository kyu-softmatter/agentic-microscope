# Real channel configuration with the particle label swapped to a 647-class red
# — instead of the FITC/YOYO-1 same-channel collision (computed in
# kb/systems/current.md, config/scopes/current-laser.yaml), this plan separates
# them physically into YOYO-1 (DNA, 488/green) + 647-class (particle, 640/red).
#
#   python -m optics.cli check config/channels/particle647-yoyo1-2color.yaml
#
# Expected: both channels grade HARD (margin 0.87) — evidence: assumed, so the
# blocking requirement rises to 7 OD, and with no measured value for the
# dichroic notch it stays an approximation (typical peak_transmission/reflection
# values, note at the top of data/filters.yaml), so not PASS yet. For crosstalk
# it is normal for the two channels to have a large margin from each other
# (the recommend screening gave 10.0 — here check recomputes the actual
# inter-channel crosstalk).
#
# ⚠ dye: ATTO647N is an example. If the conjugate actually attached to the
# particle is different — AlexaFluor647 / Cy5 / SA647(streptavidin) /
# DEX647(dextran) / Phal647(phalloidin) etc. — change it to that name. Dyes in
# this wavelength band barely diverge in the optical numbers (excitation
# efficiency/blocking/crosstalk), but what was actually used is a chemical fact
# and must not be substituted arbitrarily.
#
# ⚠ objective is entered as 100x Oil (na 1.45, Nosepiece position 5,
# MRD71970) — kb/systems/current.md > objectives has been switched to
# verified: true, so it is an actual value, but "this objective is used for this
# experiment" is not something the user settled; it is the default at the time
# this file was written. If a different objective is used (e.g. 40x WI — for a
# DNA-stretching tweezer setup water immersion may fit better), change this
# block and check again.
#
# ⚠ detector: Kinetix is registered in data/detectors.yaml (QE curve, pixel_um
# included). But read_noise_e is null because the camera mode (Speed/Sensitivity/
# DynamicRange, between 1.2~2.0 e-) is unsettled, and full_well_e/
# dark_e_per_s are null because the datasheet itself has no values.
# `optics.cli check` needs these three values to compute SNR/saturation, so
# until the mode actually used is settled this channel comes out BLOCKED
# (see docs/02 §10).
#
# The splitter (DM A561LP) is stacked onto the emission list as the stage after
# `dichroic:` (the main Di01-T), because the Channel model has only one dichroic
# field — the same way optics/recommend.py handles splitters
# ({ref: registry, side: reflect|transmit}).

channels:
  - name: "DNA-YOYO1"
    dye: YOYO1
    objective:
      label: "6-Plan Apo LmbdD0.13 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Kinetix
    source: [LUN-F-XL, "488"]
    excitation: []   # laser line is already narrow; no separate excitation filter (scope note)
    dichroic: "Di01-T405/488/568/647-13x15x0.5"
    emission:
      - {ref: "DM A561LP", side: reflect}   # 561nm reflected side = Kinetix_blue
      - "EM1-525/36"
    port_fraction: 1.0

  - name: "Particle-647"
    dye: ATTO647N   # replace with the actual conjugate name (note above)
    objective:
      label: "6-Plan Apo LmbdD0.13 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Kinetix
    source: [LUN-F-XL, "640"]
    excitation: []
    dichroic: "Di01-T405/488/568/647-13x15x0.5"
    emission:
      - {ref: "DM A561LP", side: transmit}  # 561nm transmitted side = Kinetix_red
      - "EM1-705/72"
    port_fraction: 1.0
