# Example 2-channel (488 / 647) proposal — a reference showing what numbers the
# gate produces once the specs are all filled in.
#
#   python -m optics.cli check config/channels/proposed-2color.yaml
#
# One problem is planted on purpose: a polarizer is left in the 488 channel's
# excitation path. Not a polarization experiment, so it is pure loss, and the
# ablation analysis must catch it as "remove".

channels:
  - name: "488"
    dye: AlexaFluor488
    objective:
      label: "Plan Apo Lmbd 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Prime95B
    source: [Spectra, Cyan]
    excitation: ["FF01-475/35", "Polarizer-Linear"]   # <- the leftover polarizer
    dichroic: "Di03-R405/488/561/635"
    emission: ["FF01-525/45"]
    port_fraction: 1.0

  - name: "647"
    dye: ATTO647N
    objective:
      label: "Plan Apo Lmbd 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Prime95B
    source: [Spectra, Red]
    excitation: ["FF01-640/14"]
    dichroic: "Di03-R405/488/561/635"
    emission: ["FF01-692/40"]
    port_fraction: 1.0
