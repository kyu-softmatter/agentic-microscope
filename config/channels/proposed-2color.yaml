# 2채널(488 / 647) 구성 제안 예시 — 스펙이 다 채워졌을 때 게이트가 어떤
# 숫자를 내는지 보여주는 참조용.
#
#   python -m optics.cli check config/channels/proposed-2color.yaml
#
# 일부러 문제를 하나 심어두었다: 488 채널의 여기 경로에 편광자가 남아 있다.
# 편광 실험이 아니므로 순손실이고, ablation 분석이 이를 "remove"로 잡아내야 한다.

channels:
  - name: "488"
    dye: AlexaFluor488
    objective:
      label: "Plan Apo Lmbd 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Prime95B
    source: [Spectra, Cyan]
    excitation: ["FF01-475/35", "Polarizer-Linear"]   # <- 남아 있는 편광자
    dichroic: "Di03-R405/488/561/635"
    emission: ["FF01-525/45"]
    port_fraction: 1.0

  - name: "647"
    dye: ATTO647N
    objective:
      label: "Plan Apo Lmbd 100x Oil"
      magnification: 100
      na: 1.45
      immersion: oil
      verified_na: true
    detector: Prime95B
    source: [Spectra, Red]
    excitation: ["FF01-640/14"]
    dichroic: "Di03-R405/488/561/635"
    emission: ["FF01-692/40"]
    port_fraction: 1.0
