# 세대 A/B에서 실제로 관찰된 647 채널을 그대로 옮긴 것.
#
# 이 파일의 목적은 통과시키는 게 아니라 **게이트가 거절하는 것을 보여주는 것**이다.
# 메타데이터에 남아 있는 정보만으로는 광학적 타당성을 판정할 수 없다.
#
#   python -m optics.cli check config/channels/legacy-observed.yaml
#
# 기대 결과: BLOCKED
#   - 'DA/FI/TR10Empty' 큐브의 통과대역 미상
#   - 'Wheel-A:Filter-0' 위치의 필터 미상
#   - 대물렌즈 NA 미검증
#
# 이 세 가지가 채워지기 전까지는 어떤 추천도 근거가 없다.

channel:
  name: "647-Cy5 (as observed)"
  dye: SA647                      # ⚠ 실제 형광단 미확정
  objective:
    label: "5-Plan Apo Lmbd 100x Oil"
    magnification: 100
    na: 1.45                      # ⚠ 추정값
    immersion: oil
    verified_na: false
  detector: Prime95B
  source: [Spectra, Red]          # Spectra-Red_Level: 10 로 관찰
  excitation: []                  # 여기측 필터 기록 없음 (큐브 내장 추정)
  dichroic: "DA/FI/TR10Empty"     # kind: unknown -> BLOCKED
  emission: ["Wheel-A:Filter-0"]  # kind: unknown -> BLOCKED
  port_fraction: 1.0              # LightPath 4-L100
