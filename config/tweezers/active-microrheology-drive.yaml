# Trap drive spec for the probe in
# config/channels/active-microrheology-probe-tracer.yaml
#
#   python config/tweezers/run_pattern.py --plan config/tweezers/active-microrheology-drive.yaml
#
# Written 2026-08-26. Route decided the same day: the drive is a generated .tpf
# pattern, not TCP position streaming, because the force readout
# F = kappa * (x_bead - x_trap) needs x_trap(t) known and the Tweez 300 TCP
# interface has no readback of any kind to check it against.
# → kb/decisions/2026-08-26-tweezers-pattern-vs-direct.md

name: active-microrheology-drive
channel: config/channels/active-microrheology-probe-tracer.yaml

# Trap and pattern names as they exist in the Tweez project. The trap itself and
# its wait states come from the GUI-built project template (see `project`
# below) -- TCP cannot create wait states, only assign patterns.
trap: "Probe"
pattern_name: "Drive"

# Absolute path on the microscope PC. The manual states TCP file paths are
# absolute. Leave null to skip LOAD_PROJECT and use whatever the GUI has open.
project: null

pattern:
  shape: bounded_random_walk    # circle | oscillation | raster | bounded_random_walk
  n_points: 2000
  step_um: 0.25
  half_width_um: 8.0            # walk boundary, NOT the trapping range
  seed: 11                      # mandatory: this IS the record of the trajectory
  strength: 1.0                 # relative, multiplied by the trap's own strength

loop:
  # Every trap in the loop costs one switching interval per pass, so this scales
  # every time and speed below linearly. Two traps here: the probe plus one
  # holding trap. MUST match the real project -- read it, do not assume.
  n_traps: 2
  switching_rate_hz: 100000     # manual p.6 quotes 100 kHz max for the Tweez 305

drive:
  target_speed_um_s: 30.0       # top of the channel file's 0-30 um/s range
  # wait_states | dwell | switching_rate -- see the plan output for what each
  # costs. wait_states is the vendor's mechanism and is GUI-only, hence the
  # project template above.
  slowdown: wait_states

calibration:
  # The Tweez GUI calibration these um coordinates assume. NEITHER PART IS
  # READABLE OR SETTABLE OVER TCP (manual pp. 66-69 have no calibration command),
  # so this block is a recorded assumption, not a measurement -- its only job is
  # to make a mismatch visible to a human.
  #
  # Both Tweez calibrations are objective-dependent and both are invalidated by
  # an objective change:
  #   - GUI calibration (manual pp. 35-38): Beam Position (LCS<->ICS) +
  #     Magnification (ICS<->WCS, px -> um). Re-done by dragging a scale line
  #     over a graticule. "whenever ... this relation changes i.e., due to
  #     exchanged objective (different magnification), camera remounting".
  #   - Trapping field calibration (manual pp. 28-32): AOD response, measured
  #     with a photodiode over the objective. "switching to different objective
  #     ... may not be accurate anymore ... particularly important when
  #     performing e.g., force measurements, micro rheology".
  #
  # So if hardware/microscope.py moves the Nosepiece, this spec's um are wrong
  # and nothing in either interface will say so.
  objective: "4-Apo LmbdS 40x WI"   # Nosepiece position 3, per the channel file
  # Calibrations are per-camera (manual p.37). The Tweez GUI takes a Kinetix,
  # uses it, then releases it (user, 2026-08-26) -- the same body Micro-Manager
  # drives, and PVCAM gives a camera to one process at a time. So the order is:
  # Tweez GUI takes the camera -> calibrate + set up traps -> release ->
  # hardware/microscope.py loads its configuration -> acquire. TCP trap and
  # pattern commands need no live image, so the drive still runs after release.
  # Which body is it, Kinetix_red (>561, the 647 probe) or Kinetix_blue?
  camera: null
  um_per_px: null         # the Magnification value, read off the GUI
  taken: null             # date the calibration was last performed

field_calibration:
  # The AOD trapping-field calibration, which is System Manager state and is
  # NOT carried by a GUI project (manual pp.28-32 vs p.65). Objective-dependent
  # like the GUI one, and the manual calls redoing it after an objective change
  # "particularly important when performing e.g. force measurements, micro
  # rheology" -- i.e. exactly this experiment. Saved/loaded from the System
  # Manager's own File menu. The plan blocks while this is unrecorded, and
  # blocks again if it disagrees with calibration.objective above.
  objective: null
  taken: null

trapping_range:
  # Half-extents of the calibrated AOD field, um.
  #
  # ✅ RECORDED 2026-09-06, and it settles the open question. Operator
  # statement: "trapping area is always square, the center of the square is
  # located in the middle of the camera view, the square size is around
  # (-40um to 40um) in x and y."
  #
  # ⚠ THIS CONTRADICTS THE TRAPEZOID CLAIM, and the contradiction is recorded
  # rather than resolved by preference.
  #   kb/decisions/2026-08-26-tweezers-pattern-vs-direct.md §"To settle" item 2
  #   says "the trapping range is a trapezoid, not a rectangle -- the GUI draws
  #   a 'green trapezoid' set by the AOD calibration", and
  #   kb/decisions/2026-08-27 lists the rectangle as a known simplification.
  #   The operator now says square. An operator statement about their own
  #   instrument outranks a shape read off a GUI drawing -- a square drawn in
  #   perspective, or with a skewed AOD calibration, looks like a trapezoid --
  #   so `fits_within`'s rectangular check is now believed SUFFICIENT and not
  #   merely necessary. If a pattern ever deforms while passing the range
  #   check, that belief is what to re-examine first.
  #
  # SQUARE AND CENTRED IS WHAT MAKES THE TRANSFORM COMPUTABLE. Centred on the
  # camera field means trap (0,0) is the field centre, which is what the
  # measured TRAP_ORIGIN_OFFSET_UM = (-1.013, -1.015) um in
  # config/tweezers/trap_sequence.py independently confirms to about a
  # micrometre. Square means one scale serves both axes. And because the Tweez
  # software commands in MICROMETRES AT THE SAMPLE, that scale is 1:1 -- so
  # px = p0 + diag([1,-1])/um_per_px @ um is fully determined at any binning,
  # with no free parameter left for a sine to fit.
  #
  # Still objective-dependent: this is the 100x figure. This channel runs
  # 40x WI, where the field is wider and the extent has NOT been stated.
  # ⚠ STILL null FOR THIS CHANNEL, DELIBERATELY, AND THAT IS NOT AN OVERSIGHT.
  # The +-40 um above is the 100x Oil figure. THIS channel's
  # `calibration.objective` is the 40x WI, and the extent at 40x has never been
  # stated -- the AOD deflection maps to a LARGER sample field at lower
  # magnification, so the half-extent in um grows, roughly with the
  # magnification ratio.
  #
  # It was briefly filled in with 40/40 on 2026-09-06 and that was wrong: it
  # put a 100x number under a 40x channel and flipped `range_status` from
  # BLOCKED to OK on a value that does not apply. Three tests caught it
  # immediately -- test_range_check_blocked_not_passed_when_unrecorded exists
  # for exactly this, and its docstring says why: "an unverified extent must
  # not read as OK -- silently clipped points are the exact failure mode."
  # Recording a real measurement against the wrong objective is not better than
  # recording nothing; it is worse, because it reads as verified.
  #
  # To close it: ask for the half-extent at 40x WI, or run this channel at 100x
  # and set calibration.objective to match. The 100x value lives in
  # kb/systems/current.md > optical_tweezers > trapping_range.
  half_width_um: null
  half_height_um: null
